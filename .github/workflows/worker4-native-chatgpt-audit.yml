name: Worker 4 Native ChatGPT Audit

on:
  push:
    branches:
      - 'feature/native-site-takeover'
    paths:
      - 'ghost-in-the-loop.user.js'
      - 'extension/content.js'
      - 'tests/setup.js'
      - 'tests/**/*.test.js'
      - 'tests/repo-nanny/**'
      - 'tests/e2e/repo-nanny/send-evidence.spec.js'
      - 'tests/e2e/native-chatgpt-takeover.spec.js'
      - 'tests/e2e/native-chatgpt-rerender-worker4.spec.js'
      - 'tests/e2e/lifecycle-mobile-perf.spec.js'
      - '.github/workflows/worker4-native-chatgpt-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Base certification and syntax
        run: npm run cert:base && npm run lint
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: |
          mkdir -p worker4-results
          npm run test:unit -- --runInBand --json --outputFile=worker4-results/jest.json
      - name: Report unit failures
        if: steps.unit.outcome == 'failure'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'worker4-results/jest.json';
          if (!fs.existsSync(p)) {
            console.log('::error::Jest failed without producing worker4-results/jest.json');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          const failed = (report.testResults || []).filter((r) => r.status === 'failed');
          for (const r of failed) {
            const rel = r.name.startsWith(process.cwd()) ? r.name.slice(process.cwd().length + 1) : r.name;
            const failedAssertions = (r.assertionResults || []).filter((a) => a.status === 'failed');
            const names = failedAssertions.map((a) => a.fullName).join(' | ');
            console.log(`::error file=${rel}::Jest suite failed${names ? ': ' + names : ''}`);
          }
          if (!failed.length) console.log('::error::Jest exited non-zero but JSON reported no failed suite');
          NODE
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Native takeover cross-browser matrix
        run: npx playwright test tests/e2e/native-chatgpt-takeover.spec.js --project=chromium --project=chromium-mobile --project=firefox
      - name: Whole-composer fail-closed probe
        run: npx playwright test tests/e2e/native-chatgpt-rerender-worker4.spec.js --project=chromium
      - name: Representative mobile resource and recovery performance
        run: npx playwright test tests/e2e/lifecycle-mobile-perf.spec.js --project=chromium-mobile
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker4-native-chatgpt-audit
          path: |
            e2e-results.json
            worker4-results/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce unit gate
        if: always() && steps.unit.outcome == 'failure'
        run: exit 1
