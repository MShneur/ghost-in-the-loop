name: R5 A2 Long Chat Builder

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - .github/workflows/r5-a2-longchat-builder.yml
      - ghost-in-the-loop.user.js
      - extension/content.js

permissions:
  contents: write

jobs:
  build-and-falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated-branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard assignment lease and head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected='${{ github.sha }}'
          test "$actual" = "$expected"
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json', 'utf8'));
          if (!state.lease || state.lease.assignmentId !== 'R5-A2-LONGCHAT-BUILD') throw new Error('A2 lease missing');
          if (state.lease.holder !== 'scheduled-agent-6-longchat-builder-successor') throw new Error('unexpected lease holder');
          if (state.branch !== 'agent/8.8-repair-resume') throw new Error('unexpected branch');
          console.log('lease/head guard PASS', process.env.GITHUB_SHA);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate or verify exact committed candidate
        shell: bash
        run: |
          if grep -q "const collectLegacy = () =>" ghost-in-the-loop.user.js; then
            echo 'candidate already committed; exact-head verification phase'
          else
            node - <<'NODE'
            const fs = require('fs');
            const file = 'ghost-in-the-loop.user.js';
            const source = fs.readFileSync(file, 'utf8');
            const start = source.indexOf('function _collectAnswerCandidates(selectors, tier) {');
            const end = source.indexOf('\nfunction _selectAnswerCandidate()', start);
            if (start < 0 || end < 0) throw new Error('answer collector boundaries not found');
            const replacement = `function _collectAnswerCandidates(selectors, tier) {
  const selectorList = Array.isArray(selectors)
    ? selectors.filter(sel => typeof sel === 'string' && sel)
    : [];
  const collectLegacy = () => {
    const byElement = new Map();
    for (const [selectorIndex, sel] of selectorList.entries()) {
      let matches = [];
      try { matches = [...document.querySelectorAll(sel)]; } catch(_) { matches = []; }
      const start = Math.max(0, matches.length - ANSWER_SCAN_LIMIT);
      for (let i = start; i < matches.length; i++) {
        const el = matches[i];
        if (!_answerNodeUsable(el)) continue;
        const text = _answerText(el);
        if (!_answerLooksLikeContent(el, text, tier)) continue;
        const prior = byElement.get(el);
        if (!prior || selectorIndex < prior.selectorIndex) byElement.set(el, { el, text, tier, selectorIndex });
      }
    }
    return [...byElement.values()].sort((a, b) => _answerDomOrder(a.el, b.el));
  };
  if (!selectorList.length) return [];

  let grouped = [];
  try { grouped = [...document.querySelectorAll(selectorList.join(','))]; }
  catch(_) { return collectLegacy(); }

  const tailCounts = new Array(selectorList.length).fill(0);
  let incompleteTails = selectorList.length;
  const byElement = new Map();
  for (let i = grouped.length - 1; i >= 0; i--) {
    const el = grouped[i];
    let selectorIndex = -1;
    for (let j = 0; j < selectorList.length; j++) {
      if (tailCounts[j] >= ANSWER_SCAN_LIMIT) continue;
      let matched = false;
      try { matched = !!(el.matches && el.matches(selectorList[j])); }
      catch(_) { return collectLegacy(); }
      if (!matched) continue;
      tailCounts[j] += 1;
      if (tailCounts[j] === ANSWER_SCAN_LIMIT) incompleteTails -= 1;
      if (selectorIndex < 0 || j < selectorIndex) selectorIndex = j;
    }
    if (selectorIndex >= 0 && _answerNodeUsable(el)) {
      const text = _answerText(el);
      if (_answerLooksLikeContent(el, text, tier)) byElement.set(el, { el, text, tier, selectorIndex });
    }
    if (incompleteTails === 0) break;
  }
  return [...byElement.values()].sort((a, b) => _answerDomOrder(a.el, b.el));
}`;
            fs.writeFileSync(file, source.slice(0, start) + replacement + source.slice(end));
            NODE
            npm run build:extension
            node --check ghost-in-the-loop.user.js
            node --check extension/content.js
            npm run check:generated
            npx jest tests/issuefixes.test.js tests/sendtransaction.test.js --runInBand
            git config user.name 'ghost-in-the-loop[bot]'
            git config user.email 'ghost-in-the-loop[bot]@users.noreply.github.com'
            git add ghost-in-the-loop.user.js extension/content.js
            test -n "$(git status --short)"
            git commit -m 'perf: bound long-chat assistant selector collection'
            git push origin HEAD:agent/8.8-repair-resume
            echo 'candidate committed; next isolated-branch push will perform exact-head gates'
            exit 0
          fi

          npm run lint
          npm run check:generated
          npx jest tests/issuefixes.test.js tests/sendtransaction.test.js --runInBand
          npm run test:unit -- --runInBand
          npx playwright test tests/e2e/long-chat-perf-a2.spec.js --project=chromium
          mkdir -p test-results
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('test-results/r5-a2-exact-head.json', JSON.stringify({
            head: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            assignment: 'R5-A2-LONGCHAT-BUILD',
            note: 'Exact committed grouped-selector candidate passed lint, generated parity, focused/full Jest, and Chromium A2 falsification gate.'
          }, null, 2) + '\n');
          NODE
          git config user.name 'ghost-in-the-loop[bot]'
          git config user.email 'ghost-in-the-loop[bot]@users.noreply.github.com'
          git rm .github/workflows/r5-a2-longchat-builder.yml
          git commit -m 'ci: remove R5 A2 long-chat builder carrier'
          git push origin HEAD:agent/8.8-repair-resume

      - name: Upload A2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-a2-long-chat-builder
          path: test-results
          if-no-files-found: warn
