name: Apply v8.5.3 answer selection

on:
  push:
    branches:
      - agent/v8.5.3-answer-selection
    paths:
      - scripts/apply-v853-answer-selection.cjs
      - .github/workflows/apply-v853-answer-selection.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8.5.3-answer-selection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply narrow source patch
        run: node scripts/apply-v853-answer-selection.cjs
      - name: Install dependencies
        run: npm ci
      - name: Regenerate Firefox artifact
        run: npm run build:extension
      - name: Syntax and unit verification
        run: |
          npm run lint
          npm run test:unit -- --runInBand
          npm run check:generated
      - name: Commit verified item 1
        run: |
          rm scripts/apply-v853-answer-selection.cjs
          rm .github/workflows/apply-v853-answer-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ghost-in-the-loop.user.js extension/content.js tests/answerselection853.test.js scripts/apply-v853-answer-selection.cjs .github/workflows/apply-v853-answer-selection.yml
          git commit -m 'fix: select the latest Perplexity answer reliably'
          git push origin HEAD:agent/v8.5.3-answer-selection
