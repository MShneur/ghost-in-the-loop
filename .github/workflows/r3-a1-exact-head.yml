name: R3 A1 Exact-Head Recovery

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - .github/workflows/r3-a1-exact-head.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r3-a1-exact-head
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify guarded carrier and lease
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/8.8-repair-resume"
          test "$(git rev-parse HEAD^)" = "acf3696f266bdd0620321b7e5e1d62c8c6a6918f"
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json', 'utf8'));
          if (state.lease?.holder !== 'scheduled-agent-1') throw new Error(`unexpected lease holder: ${state.lease?.holder}`);
          if (state.lease?.assignmentId !== 'R3-A1-RR-CI-RECOVERY') throw new Error(`unexpected assignment: ${state.lease?.assignmentId}`);
          if (state.lease?.branchHead !== 'a17099d5a17e8f7d313196635ae587a4bac6f440') throw new Error(`unexpected inspected head: ${state.lease?.branchHead}`);
          if (Date.parse(state.lease?.expiresAt || '') <= Date.now()) throw new Error(`expired lease: ${state.lease?.expiresAt}`);
          NODE
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Execute fail-closed setup and browser matrix
        id: matrix
        if: steps.guard.outputs.ok == '1'
        shell: bash
        run: |
          set +e
          mkdir -p .gitl/evidence/round-3
          SETUP_CODE=125
          BROWSER_INSTALL_CODE=125
          FIREFOX_CODE=125
          CHROMIUM_CODE=125
          MOBILE_CODE=125

          timeout 8m npm ci > .gitl/evidence/round-3/r3-a1-setup.log 2>&1
          SETUP_CODE=$?

          if [ "$SETUP_CODE" -eq 0 ]; then
            timeout 12m npx playwright install --with-deps chromium firefox > .gitl/evidence/round-3/r3-a1-browser-install.log 2>&1
            BROWSER_INSTALL_CODE=$?
          else
            printf 'NOT RUN: npm ci exited %s\n' "$SETUP_CODE" > .gitl/evidence/round-3/r3-a1-browser-install.log
          fi

          if [ "$SETUP_CODE" -eq 0 ] && [ "$BROWSER_INSTALL_CODE" -eq 0 ]; then
            timeout 6m npx playwright test tests/e2e/repair-resume.spec.js --project=firefox > .gitl/evidence/round-3/r3-a1-firefox.log 2>&1
            FIREFOX_CODE=$?
            timeout 6m npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium > .gitl/evidence/round-3/r3-a1-chromium.log 2>&1
            CHROMIUM_CODE=$?
            timeout 6m npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium-mobile > .gitl/evidence/round-3/r3-a1-chromium-mobile.log 2>&1
            MOBILE_CODE=$?
          else
            printf 'NOT RUN: setup=%s browser_install=%s\n' "$SETUP_CODE" "$BROWSER_INSTALL_CODE" > .gitl/evidence/round-3/r3-a1-firefox.log
            cp .gitl/evidence/round-3/r3-a1-firefox.log .gitl/evidence/round-3/r3-a1-chromium.log
            cp .gitl/evidence/round-3/r3-a1-firefox.log .gitl/evidence/round-3/r3-a1-chromium-mobile.log
          fi

          echo "setup_code=$SETUP_CODE" >> "$GITHUB_OUTPUT"
          echo "browser_install_code=$BROWSER_INSTALL_CODE" >> "$GITHUB_OUTPUT"
          echo "firefox_code=$FIREFOX_CODE" >> "$GITHUB_OUTPUT"
          echo "chromium_code=$CHROMIUM_CODE" >> "$GITHUB_OUTPUT"
          echo "mobile_code=$MOBILE_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve workflow job id
        id: jobmeta
        if: always() && steps.guard.outputs.ok == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          JOB_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name == "exact-head") | .id' | head -n 1)
          echo "job_id=${JOB_ID:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Durable handoff and carrier removal
        if: always() && steps.guard.outputs.ok == '1'
        shell: bash
        env:
          SETUP_CODE: ${{ steps.matrix.outputs.setup_code }}
          BROWSER_INSTALL_CODE: ${{ steps.matrix.outputs.browser_install_code }}
          FIREFOX_CODE: ${{ steps.matrix.outputs.firefox_code }}
          CHROMIUM_CODE: ${{ steps.matrix.outputs.chromium_code }}
          MOBILE_CODE: ${{ steps.matrix.outputs.mobile_code }}
          JOB_ID: ${{ steps.jobmeta.outputs.job_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const code = (value) => value === undefined || value === '' || Number.isNaN(Number(value)) ? 125 : Number(value);
          const setup = code(process.env.SETUP_CODE);
          const install = code(process.env.BROWSER_INSTALL_CODE);
          const firefox = code(process.env.FIREFOX_CODE);
          const chromium = code(process.env.CHROMIUM_CODE);
          const mobile = code(process.env.MOBILE_CODE);
          const testsRan = setup === 0 && install === 0;
          const pass = testsRan && firefox === 0 && chromium === 0 && mobile === 0;
          const phase = setup !== 0 ? 'npm-ci' : install !== 0 ? 'playwright-browser-install' : pass ? 'browser-matrix-pass' : 'browser-matrix-failure';
          const status = pass ? 'submitted' : 'blocked';
          const runId = process.env.GITHUB_RUN_ID;
          const jobId = process.env.JOB_ID || 'UNKNOWN';
          const testedHead = process.env.GITHUB_SHA;
          const productHead = '2d63c2506dd62705a46a368cefdfc7be0c4f6ebe';
          const finished = new Date().toISOString();
          const evidenceDir = '.gitl/evidence/round-3';
          const resultPath = path.join(evidenceDir, 'r3-a1-exact-head-result.md');
          const workerPath = path.join(evidenceDir, 'worker-3.md');
          const logPaths = [
            '.gitl/evidence/round-3/r3-a1-setup.log',
            '.gitl/evidence/round-3/r3-a1-browser-install.log',
            '.gitl/evidence/round-3/r3-a1-firefox.log',
            '.gitl/evidence/round-3/r3-a1-chromium.log',
            '.gitl/evidence/round-3/r3-a1-chromium-mobile.log'
          ];
          fs.mkdirSync(evidenceDir, { recursive: true });

          fs.writeFileSync(resultPath, [
            '# R3 A1 Exact-Head Browser Result',
            '',
            `- Tested carrier head: \`${testedHead}\``,
            `- Product head under test: \`${productHead}\``,
            `- Branch: \`${process.env.GITHUB_REF_NAME}\``,
            `- Workflow run ID: \`${runId}\``,
            `- Workflow job ID: \`${jobId}\``,
            `- Failure/pass phase: \`${phase}\``,
            '',
            '## Setup and command exit codes',
            '',
            `- \`npm ci\`: \`${setup}\``,
            `- \`npx playwright install --with-deps chromium firefox\`: \`${install}\``,
            `- \`npx playwright test tests/e2e/repair-resume.spec.js --project=firefox\`: \`${firefox}\``,
            `- \`npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium\`: \`${chromium}\``,
            `- \`npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium-mobile\`: \`${mobile}\``,
            '',
            'Exit code 125 means the command was not run because an earlier setup gate failed. Exit code 124 means the command hit its bounded timeout.',
            '',
            `## Conclusion`,
            '',
            pass ? 'PASS. All three required browser commands exited 0.' : `BLOCKED at ${phase}. Exact logs are committed and R3-A2 is activated with this failure evidence.`,
            ''
          ].join('\n'));

          const fmt = (n) => n === 0 ? 'PASS' : n === 125 ? 'NOT RUN' : `FAIL (${n})`;
          fs.writeFileSync(workerPath, [
            '# Ghost Worker Evidence',
            '',
            '## Identity',
            '- Round: 3',
            '- Worker: 3 (assignment evidence slot)',
            '- Successor agent: scheduled-agent-1 / nominal Worker 1 wake',
            '- Role: Builder / test recovery successor',
            '- Assignment ID: R3-A1-RR-CI-RECOVERY',
            '- Started at: 2026-08-07T01:04:24Z',
            `- Finished at: ${finished}`,
            '',
            '## State Read',
            '- Branch: `agent/8.8-repair-resume`',
            '- Starting inspected head: `a17099d5a17e8f7d313196635ae587a4bac6f440`',
            `- Tested carrier head: \`${testedHead}\``,
            `- Product head under test: \`${productHead}\``,
            '- Lease state: scheduled-agent-2 expired at 00:56:27Z without durable Worker 3 handoff; scheduled-agent-1 reclaimed after branch/status/run checks.',
            '- Dependencies: none.',
            '',
            '## Step Performed',
            'Reclaimed the expired A1 assignment, replaced the carrier with a fail-closed version that makes setup/install failures durable, and attempted the exact-head Firefox, desktop Chromium, and Pixel 7 Chromium matrix.',
            '',
            '## Research Sources',
            '- Repository evidence: Round 2 Worker 6 required authoritative exact-head browser execution before certification.',
            '- Repository evidence: Round 3 Worker 1 repaired the Firefox-only isMobile matrix issue but left execution pending.',
            '- Repository evidence: the prior A1 carrier could terminate before its evidence/handoff step when setup or browser installation failed.',
            '- Inference: none used to claim browser results; workflow exit codes and committed logs are authoritative.',
            '',
            '## Changes',
            '- Product code changed: no.',
            '- Temporary carrier: `.github/workflows/r3-a1-exact-head.yml` hardened and removed by this handoff.',
            `- Durable result: \`${resultPath}\` plus five logs and this file.`,
            '',
            '## Tests',
            `- npm ci: ${fmt(setup)}.`,
            `- Playwright browser install: ${fmt(install)}.`,
            `- Firefox focused command: ${fmt(firefox)}.`,
            `- Desktop Chromium production path: ${fmt(chromium)}.`,
            `- Pixel 7 Chromium production path: ${fmt(mobile)}.`,
            `- Workflow run ID: \`${runId}\`; job ID: \`${jobId}\`.`,
            '- Full unit suite: NOT RUN — outside this bounded execution-only assignment.',
            '- Certification: NOT CLAIMED — independent R3-A3 remains required after a passing matrix.',
            '',
            '## Acceptance Criteria',
            `- Firefox no longer executes Chromium-only isMobile context: ${firefox === 0 ? 'PASS' : 'NOT PROVEN'} — exact Firefox command.`,
            `- Firefox-safe narrow viewport coverage remains executable: ${firefox === 0 ? 'PASS' : 'NOT PROVEN'} — exact Firefox command.`,
            `- Production-path fixture runs on exact-head Chromium: ${chromium === 0 ? 'PASS' : 'NOT PROVEN'}.`,
            `- Production-path fixture runs on Pixel 7 Chromium: ${mobile === 0 ? 'PASS' : 'NOT PROVEN'}.`,
            `- Zero Send actuation and restart assertions are recorded: ${chromium === 0 && mobile === 0 ? 'PASS' : 'NOT PROVEN'}.`,
            '- Failure creates the next ready repair assignment rather than stopping: PASS — R3-A2 activation below on any non-pass.',
            '',
            '## Safety Checks',
            '- Send authority unchanged: PASS — no product source modification.',
            '- CHOICE behavior unchanged: PASS.',
            '- Route and lease safety unchanged: PASS.',
            '- No `main`, merge, tag, release, or publish action: PASS.',
            '',
            '## Risks and Limits',
            pass ? '- Passing browser matrix still requires independent Red Team certification.' : `- A1 is blocked at ${phase}; no browser pass is inferred for skipped or failing commands.`,
            '',
            '## Recommended Next Action',
            pass ? 'Execute R3-A3-RR-REDTEAM-CERT and attempt to falsify this exact-head result.' : 'Execute R3-A2-RR-PROVEN-FAILURE-REPAIR using the committed setup/test logs and exact reproduction commands; repair only the proven failure phase.',
            '',
            '## Assignment Status',
            `- ${status}`,
            ''
          ].join('\n'));

          const planPath = '.gitl/orchestration/round-plan.json';
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const a1 = plan.assignments.find(a => a.id === 'R3-A1-RR-CI-RECOVERY');
          const a2 = plan.assignments.find(a => a.id === 'R3-A2-RR-PROVEN-FAILURE-REPAIR');
          const a3 = plan.assignments.find(a => a.id === 'R3-A3-RR-REDTEAM-CERT');
          a1.status = status;
          a1.executedBy = 'scheduled-agent-1-successor';
          a1.testedCarrierHead = testedHead;
          a1.productHeadUnderTest = productHead;
          a1.workflowRunId = runId;
          a1.workflowJobId = jobId;
          a1.failurePhase = phase;
          a1.exitCodes = { setup, browserInstall: install, firefox, chromium, chromiumMobile: mobile };
          a1.logPaths = logPaths;
          if (pass) {
            a2.status = 'not-needed';
            a2.notNeededReason = 'R3-A1 exact-head Firefox, Chromium, and Pixel 7 Chromium commands all exited 0.';
            a3.status = 'ready';
          } else {
            a2.status = 'ready';
            a2.dependencies = ['R3-A1-RR-CI-RECOVERY:blocked'];
            a2.goal = phase === 'browser-matrix-failure'
              ? 'Repair only the browser/test defect proven by R3-A1, rerun focused exact-head tests, and preserve safety invariants.'
              : 'Repair only the exact-head carrier/setup failure proven by R3-A1, then rerun the required browser matrix without changing product behavior.';
            a2.failureEvidence = {
              phase,
              testedHead,
              productHead,
              workflowRunId: runId,
              workflowJobId: jobId,
              exitCodes: { setup, browserInstall: install, firefox, chromium, chromiumMobile: mobile },
              logs: logPaths,
              reproduction: [
                'npm ci',
                'npx playwright install --with-deps chromium firefox',
                'npx playwright test tests/e2e/repair-resume.spec.js --project=firefox',
                'npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium',
                'npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium-mobile'
              ]
            };
          }
          plan.evidence = Array.isArray(plan.evidence) ? plan.evidence : [];
          if (!plan.evidence.some(e => e.path === workerPath)) plan.evidence.push({ worker: 3, assignment: a1.id, executedBy: 'scheduled-agent-1-successor', path: workerPath, status });
          fs.writeFileSync(planPath, JSON.stringify(plan, null, 2) + '\n');

          const statePath = '.gitl/autopilot-state.json';
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          state.completedWorkers = [...new Set([...(state.completedWorkers || []), 3])];
          state.headAtLastHandoff = testedHead;
          state.currentStep = pass
            ? 'R3-A1 exact-head matrix submitted by scheduled-agent-1 successor; R3-A3-RR-REDTEAM-CERT is ready.'
            : `R3-A1 blocked at ${phase} under scheduled-agent-1 successor; R3-A2-RR-PROVEN-FAILURE-REPAIR is ready with exact failure evidence.`;
          state.nextAction = pass
            ? 'The next eligible agent claims R3-A3-RR-REDTEAM-CERT and independently falsifies the exact-head passing evidence.'
            : 'The next eligible agent claims R3-A2-RR-PROVEN-FAILURE-REPAIR, reads Worker 3 evidence and committed logs, repairs only the proven failure phase, reruns focused exact-head tests, and hands off.';
          state.testEvidence = Array.isArray(state.testEvidence) ? state.testEvidence : [];
          for (const p of [workerPath, resultPath, ...logPaths]) if (!state.testEvidence.includes(p)) state.testEvidence.push(p);
          state.completedSteps = Array.isArray(state.completedSteps) ? state.completedSteps : [];
          state.completedSteps.push({ type: 'R3-A1-RR-CI-RECOVERY', result: pass ? 'Scheduled-agent-1 successor obtained passing exact-head Firefox, desktop Chromium, and Pixel 7 Chromium evidence and activated A3.' : `Scheduled-agent-1 successor durably recorded A1 blocker ${phase} and activated A2.` });
          state.findings = Array.isArray(state.findings) ? state.findings : [];
          state.findings.push({ worker: 1, assignmentRoleWorker: 3, type: 'exact-head-browser-matrix', finding: pass ? 'All three required browser commands exited 0 on the guarded carrier head.' : `A1 blocked at ${phase}; exit codes setup=${setup}, browserInstall=${install}, firefox=${firefox}, chromium=${chromium}, chromiumMobile=${mobile}; A2 activated.` });
          state.lease = { holder: null, assignmentId: null, acquiredAt: null, expiresAt: null, branchHead: null };
          state.blockedReason = null;
          fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
          NODE

          REMOTE_HEAD=$(git ls-remote origin refs/heads/agent/8.8-repair-resume | cut -f1)
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git config user.name "gitl-actions"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/r3-a1-exact-head.yml
          git add .github/workflows/r3-a1-exact-head.yml \
            .gitl/evidence/round-3/worker-3.md \
            .gitl/evidence/round-3/r3-a1-exact-head-result.md \
            .gitl/evidence/round-3/r3-a1-setup.log \
            .gitl/evidence/round-3/r3-a1-browser-install.log \
            .gitl/evidence/round-3/r3-a1-firefox.log \
            .gitl/evidence/round-3/r3-a1-chromium.log \
            .gitl/evidence/round-3/r3-a1-chromium-mobile.log \
            .gitl/orchestration/round-plan.json \
            .gitl/autopilot-state.json
          git diff --cached --check
          git commit -m "test(gitl): complete fail-closed R3 A1 handoff"
          git push origin HEAD:agent/8.8-repair-resume

      - name: Enforce result after durable handoff
        if: always() && steps.guard.outputs.ok == '1'
        shell: bash
        run: |
          test "${{ steps.matrix.outputs.setup_code }}" = "0"
          test "${{ steps.matrix.outputs.browser_install_code }}" = "0"
          test "${{ steps.matrix.outputs.firefox_code }}" = "0"
          test "${{ steps.matrix.outputs.chromium_code }}" = "0"
          test "${{ steps.matrix.outputs.mobile_code }}" = "0"
