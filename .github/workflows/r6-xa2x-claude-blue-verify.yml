name: Round 6 XA2X Claude Blue Exact Verification

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - '.gitl/evidence/round-6/xa2x-claude-blue-trigger.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6-xa2x-claude-blue-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Guard branch, ancestry, state, and stable trigger head
        id: guard
        shell: bash
        env:
          EXPECTED_CANDIDATE: 88b8b2a5ce31f6909e4efa5e90f5f1f723de45bc
          EXPECTED_EVIDENCE: ce3f3cbec172903cd398aa2fd6730826f42036bd
          BRANCH: agent/8.8-repair-resume
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "$BRANCH"
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE" HEAD
          git merge-base --is-ancestor "$EXPECTED_EVIDENCE" HEAD
          git diff --name-only "$EXPECTED_CANDIDATE"..HEAD | tee /tmp/xa2x-descendants.txt
          if grep -Ev '^(\.gitl/|\.github/workflows/r6-xa2x-claude-blue-verify\.yml$)' /tmp/xa2x-descendants.txt; then
            echo 'Unexpected non-coordination descendant files after XA2 candidate.' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('.gitl/orchestration/round-plan.json', 'utf8'));
          if (state.branch !== 'agent/8.8-repair-resume' || state.status !== 'active' || state.publishReady) {
            throw new Error('Project state is not eligible for XA2X verification');
          }
          const lease = state.lease;
          if (lease && Date.parse(lease.expiresAt) > Date.now()) {
            throw new Error(`Conflicting valid lease: ${lease.holder} / ${lease.assignmentId}`);
          }
          const xa2 = plan.assignments.find(a => a.id === 'R6-XA2-CLAUDE-BLUE-PROTOTYPE');
          const xa2x = plan.assignments.find(a => a.id === 'R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY');
          if (!xa2 || xa2.status !== 'blocked' || !xa2x || xa2x.status !== 'ready') {
            throw new Error('XA2/XA2X canonical plan state changed');
          }
          NODE

      - name: Recover expired XA2 lease and claim XA2X
        id: claim
        shell: bash
        env:
          BRANCH: agent/8.8-repair-resume
        run: |
          set -euo pipefail
          ACQUIRED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EXPIRES=$(date -u -d '+45 minutes' +'%Y-%m-%dT%H:%M:%SZ')
          INSPECTED=$(git rev-parse HEAD)
          export ACQUIRED EXPIRES INSPECTED
          node <<'NODE'
          const fs = require('fs');
          const p = '.gitl/autopilot-state.json';
          const state = JSON.parse(fs.readFileSync(p, 'utf8'));
          const prior = state.lease;
          if (prior && Date.parse(prior.expiresAt) > Date.now()) throw new Error('Lease became valid before claim');
          state.lease = {
            holder: `gha-r6-xa2x-${process.env.GITHUB_RUN_ID}`,
            assignmentId: 'R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY',
            nominalWorker: 1,
            executedRole: 'successor-builder-test-verifier-with-supervisor-integrator-lens',
            acquiredAt: process.env.ACQUIRED,
            expiresAt: process.env.EXPIRES,
            inspectedHead: process.env.INSPECTED,
            recoveredExpiredLease: prior ? `${prior.holder}/${prior.assignmentId}/${prior.expiresAt}` : null,
            activeWorkCheck: 'Prior XA2 lease was expired; XA2 final evidence existed; canonical plan had advanced to XA2 blocked/XA2X ready; branch was stable at trigger head and the guarded carrier is now the sole writer.'
          };
          state.currentStep = 'R6-XA2 artifact is durably blocked only on exact execution evidence. The expired predecessor XA2 lease was recovered after stable-head checks, and R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY is actively executing on a guarded exact-head carrier.';
          state.nextAction = 'Complete XA2X syntax/base/generated/lint/unit/focused-safety and Claude Blue Chromium+Firefox verification. Submit XA2/XA2X and expose XA3 only if every gate passes; otherwise preserve the exact failure and expose the smallest recovery.';
          state.automaticDispatch = {
            ...(state.automaticDispatch || {}),
            enabled: true,
            scheduledFor: 'active guarded carrier',
            nominalWorker: 3,
            assignmentId: 'R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY',
            claimableByAnyEligibleWorker: true
          };
          state.researchFallback = {
            ...(state.researchFallback || {}),
            temporarilyIneligible: true,
            reason: 'XA2X exact verification is actively executing; research may not compete with executable release verification.'
          };
          state.deliveryPressure = {
            ...(state.deliveryPressure || {}),
            checkpointStatus: 'claude-blue-exact-verification-active',
            researchOnlyWakesSinceLastProductTestPackageArtifact: 0,
            researchFallbackTemporarilyIneligible: true,
            nextArtifactAssignment: 'R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY',
            lastDeliveryDecision: 'Recover the expired XA2 handoff and execute the exact Claude Blue verification matrix before any research.'
          };
          fs.writeFileSync(p, JSON.stringify(state, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitl/autopilot-state.json
          git commit -m 'chore(gitl): claim XA2X exact verification lease'
          git push origin HEAD:"$BRANCH"
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CLAIMED_AT=$ACQUIRED" >> "$GITHUB_ENV"

      - name: Install dependencies
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/xa2x-carrier
          npm ci 2>&1 | tee test-results/xa2x-carrier/npm-ci.log

      - name: Claude Blue spec syntax
        id: spec_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/xa2x-carrier
          node --check tests/e2e/claude-blue-prototype.spec.js 2>&1 | tee test-results/xa2x-carrier/spec-syntax.log

      - name: Base certification and generated parity
        id: base
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run cert:base 2>&1 | tee test-results/xa2x-carrier/cert-base.log

      - name: Repository syntax and lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee test-results/xa2x-carrier/lint.log

      - name: Full unit suite
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit -- --runInBand 2>&1 | tee test-results/xa2x-carrier/unit.log

      - name: Focused Send CHOICE route lease uncertainty regressions
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx jest tests/sendtransaction.test.js tests/choice-state.test.js tests/repair-resume.test.js tests/tablock.test.js tests/sendsafety.test.js --runInBand 2>&1 | tee test-results/xa2x-carrier/focused-safety.log

      - name: Install Chromium and Firefox
        id: browsers
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium firefox 2>&1 | tee test-results/xa2x-carrier/browser-install.log

      - name: Run Claude Blue prototype in Chromium and Firefox
        id: blue
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/claude-blue-prototype.spec.js --project=chromium --project=firefox 2>&1 | tee test-results/xa2x-carrier/claude-blue-playwright.log

      - name: Upload exact-head evidence
        id: upload
        if: always() && steps.claim.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r6-xa2x-${{ github.run_id }}
          path: |
            test-results/
            e2e-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record exact bindings, reconcile handoff, and self-remove
        id: finalize
        if: always() && steps.claim.outcome == 'success'
        shell: bash
        env:
          BRANCH: agent/8.8-repair-resume
          DEPS: ${{ steps.deps.outcome }}
          SPEC_SYNTAX: ${{ steps.spec_syntax.outcome }}
          BASE: ${{ steps.base.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BROWSERS: ${{ steps.browsers.outcome }}
          BLUE: ${{ steps.blue.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse origin/$BRANCH)" != "$TESTED_HEAD" ]; then
            echo 'Branch changed after XA2X lease claim; refusing competing handoff.' >&2
            exit 2
          fi

          RESULT=PASS
          for value in "$DEPS" "$SPEC_SYNTAX" "$BASE" "$LINT" "$UNIT" "$FOCUSED" "$BROWSERS" "$BLUE" "$UPLOAD"; do
            if [ "$value" != success ]; then RESULT=FAIL; fi
          done

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          JOB_ID=''
          ARTIFACT_ID=''
          ARTIFACT_DIGEST=''
          ARTIFACT_NAME="r6-xa2x-${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            JOB_JSON=$(curl -fsSL -H "$AUTH" -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs/${GITHUB_RUN_ID}/jobs") || JOB_JSON='{}'
            JOB_ID=$(printf '%s' "$JOB_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const x=(j.jobs||[]).find(v=>v.name==='verify')||(j.jobs||[])[0];process.stdout.write(x?String(x.id):'')}catch{}})")
            ART_JSON=$(curl -fsSL -H "$AUTH" -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs/${GITHUB_RUN_ID}/artifacts") || ART_JSON='{}'
            ARTIFACT_ID=$(printf '%s' "$ART_JSON" | ART_NAME="$ARTIFACT_NAME" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const x=(j.artifacts||[]).find(v=>v.name===process.env.ART_NAME);process.stdout.write(x?String(x.id):'')}catch{}})")
            ARTIFACT_DIGEST=$(printf '%s' "$ART_JSON" | ART_NAME="$ARTIFACT_NAME" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const x=(j.artifacts||[]).find(v=>v.name===process.env.ART_NAME);process.stdout.write(x&&x.digest?String(x.digest):'')}catch{}})")
            if [ -n "$JOB_ID" ] && [ -n "$ARTIFACT_ID" ]; then break; fi
            sleep 2
          done
          if [ -z "$JOB_ID" ] || [ -z "$ARTIFACT_ID" ]; then
            RESULT=FAIL
          fi

          FINISHED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          export RESULT FINISHED JOB_ID ARTIFACT_ID ARTIFACT_DIGEST ARTIFACT_NAME DEPS SPEC_SYNTAX BASE LINT UNIT FOCUSED BROWSERS BLUE UPLOAD
          mkdir -p .gitl/evidence/round-6
          cat > .gitl/evidence/round-6/xa2x-claude-blue-carrier-result.md <<EOF
          # Round 6 XA2X Claude Blue Exact-Repository Carrier Result

          - Result: **${RESULT}**
          - Exact tested head: \`${TESTED_HEAD}\`
          - Required XA2 candidate ancestor: \`88b8b2a5ce31f6909e4efa5e90f5f1f723de45bc\`
          - Required XA2 evidence ancestor: \`ce3f3cbec172903cd398aa2fd6730826f42036bd\`
          - GitHub Actions run ID: \`${GITHUB_RUN_ID}\`
          - Job ID: \`${JOB_ID:-UNKNOWN}\`
          - Artifact ID: \`${ARTIFACT_ID:-UNKNOWN}\`
          - Artifact name: \`${ARTIFACT_NAME}\`
          - Artifact digest: \`${ARTIFACT_DIGEST:-UNKNOWN}\`
          - npm ci: \`${DEPS}\`
          - Claude Blue spec syntax: \`${SPEC_SYNTAX}\`
          - cert:base/generated parity: \`${BASE}\`
          - repository lint: \`${LINT}\`
          - full unit suite: \`${UNIT}\`
          - focused Send/CHOICE/route/lease/uncertainty: \`${FOCUSED}\`
          - Playwright Chromium+Firefox install: \`${BROWSERS}\`
          - Claude Blue Chromium+Firefox prototype matrix: \`${BLUE}\`
          - artifact upload: \`${UPLOAD}\`

          The carrier preserved the fixture-only/live-uncertified boundary. It did not change production source or grant live Claude structural authority.
          EOF

          cat > .gitl/evidence/round-6/claude-blue-prototype-verify.md <<EOF
          # Ghost Worker Evidence — R6 XA2X Claude Blue Prototype Verification

          ## Identity
          - Round: 6
          - Nominal worker: 1
          - Intended assignment role: Builder / test verifier
          - Executed role: successor builder-test verifier with supervisor-integrator dissent lens
          - Executed by: \`gha-r6-xa2x-${GITHUB_RUN_ID}\`
          - Assignment ID: \`R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY\`
          - Started lease claim at: \`${CLAIMED_AT}\`
          - Finished at: \`${FINISHED}\`

          ## State Read
          - Branch: \`${BRANCH}\`
          - XA2 candidate: \`88b8b2a5ce31f6909e4efa5e90f5f1f723de45bc\`
          - XA2 evidence: \`ce3f3cbec172903cd398aa2fd6730826f42036bd\`
          - Exact tested head: \`${TESTED_HEAD}\`
          - The prior XA2 lease had expired; XA2 evidence was final and the canonical plan had already advanced XA2 to blocked/XA2X ready. Stable-head checks passed before recovery.

          ## Step Performed
          Recovered the expired XA2 coordination lease, claimed XA2X canonically, and executed the predeclared exact-head repository verification matrix. No research fallback was performed.

          ## Research Sources
          - Repository evidence only for this execution step. Live Claude and live ChatGPT structural insertion remain UNKNOWN and were not inferred from fixtures.

          ## Changes
          - Verification/evidence/orchestration only. Production userscript and extension runtime: unchanged.
          - Temporary carrier workflow and trigger are removed by this handoff.

          ## Tests
          - npm ci: **${DEPS}**
          - node --check tests/e2e/claude-blue-prototype.spec.js: **${SPEC_SYNTAX}**
          - npm run cert:base: **${BASE}**
          - npm run lint: **${LINT}**
          - npm run test:unit -- --runInBand: **${UNIT}**
          - focused five-suite Send/CHOICE/route/lease/uncertainty regression set: **${FOCUSED}**
          - Playwright Chromium+Firefox installation: **${BROWSERS}**
          - Claude Blue prototype Chromium+Firefox: **${BLUE}**
          - Run: \`${GITHUB_RUN_ID}\`; job: \`${JOB_ID:-UNKNOWN}\`; artifact: \`${ARTIFACT_ID:-UNKNOWN}\`; digest: \`${ARTIFACT_DIGEST:-UNKNOWN}\`

          ## Acceptance Criteria
          - Observable exact-head carrier: **${RESULT}**
          - Syntax/base/generated/lint: **${RESULT}** only if all corresponding gates above are success.
          - Full unit and focused fail-closed safety: **${RESULT}** only if both gates above are success.
          - Claude Blue Chromium+Firefox mutant/demotion matrix: **${BLUE}**.
          - Exact run/job/artifact bindings: **$([ -n "$JOB_ID" ] && [ -n "$ARTIFACT_ID" ] && echo PASS || echo FAIL)**.
          - Live Claude structural certification: **UNKNOWN / NOT CLAIMED**.
          - Live ChatGPT structural certification: **UNKNOWN / NOT CLAIMED**.

          ## Safety Checks
          - Send authority unchanged: YES.
          - CHOICE behavior unchanged: YES.
          - Route/lease/uncertainty safeguards not weakened: YES.
          - No main, merge, auto-merge, tag, publish, or release action: YES.

          ## Risks and Limits
          Deterministic fixture success, if obtained, is not live-site certification. Physical Android/WebView/GeckoView, real IME/AT, calibrated hardware, current live ChatGPT insertion, and current live Claude insertion remain uncertified. Existing npm audit findings remain for the designated final dependency audit; no blanket dependency upgrade is authorized here.

          ## Recommended Next Action
          $([ "$RESULT" = PASS ] && echo 'Execute R6-XA3-CROSS-ADAPTER-REDTEAM immediately; do not return to research.' || echo 'Execute the ready XA2Y verification recovery, preserve the exact failed gate/logs, and make only the smallest candidate-or-carrier repair before retrying XA2X.')

          ## Assignment Status
          - **$([ "$RESULT" = PASS ] && echo submitted || echo blocked)**
          EOF

          node <<'NODE'
          const fs = require('fs');
          const result = process.env.RESULT;
          const run = Number(process.env.GITHUB_RUN_ID);
          const job = process.env.JOB_ID ? Number(process.env.JOB_ID) : null;
          const artifact = process.env.ARTIFACT_ID ? Number(process.env.ARTIFACT_ID) : null;
          const testedHead = process.env.TESTED_HEAD;
          const finished = process.env.FINISHED;
          const outcomeSummary = `deps=${process.env.DEPS}, syntax=${process.env.SPEC_SYNTAX}, base=${process.env.BASE}, lint=${process.env.LINT}, unit=${process.env.UNIT}, focused=${process.env.FOCUSED}, browsers=${process.env.BROWSERS}, blue=${process.env.BLUE}, upload=${process.env.UPLOAD}`;

          const planPath = '.gitl/orchestration/round-plan.json';
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const xa2 = plan.assignments.find(a => a.id === 'R6-XA2-CLAUDE-BLUE-PROTOTYPE');
          const xa2x = plan.assignments.find(a => a.id === 'R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY');
          const xa3 = plan.assignments.find(a => a.id === 'R6-XA3-CROSS-ADAPTER-REDTEAM');
          xa2x.executedBy = `gha-r6-xa2x-${run}`;
          xa2x.testedHead = testedHead;
          xa2x.runId = run;
          xa2x.jobId = job;
          xa2x.artifactId = artifact;
          xa2x.artifactDigest = process.env.ARTIFACT_DIGEST || null;
          xa2x.evidencePath = '.gitl/evidence/round-6/claude-blue-prototype-verify.md';

          if (result === 'PASS') {
            xa2.status = 'submitted';
            delete xa2.blockedReason;
            xa2.verificationEvidence = '.gitl/evidence/round-6/claude-blue-prototype-verify.md';
            xa2x.status = 'submitted';
            xa3.status = 'ready';
            plan.dispatch = {
              ...(plan.dispatch || {}),
              nextWake: 'earliest eligible wake',
              nominalWorker: 4,
              assignmentId: 'R6-XA3-CROSS-ADAPTER-REDTEAM',
              automatic: true,
              claimableByAnyEligibleWorker: true,
              instruction: 'Red-Team the accepted ChatGPT and verified Claude deterministic runners. Attack specialized-first selection, demotion, exact Send identity, clipping, route/rerender cleanup, decoys, mutant sensitivity, and resource bounds before mobile/performance work.'
            };
            plan.deliveryPressure = {
              ...(plan.deliveryPressure || {}),
              checkpointStatus: 'claude-blue-verified-cross-adapter-redteam-ready',
              researchOnlyWakesSinceLastProductTestPackageArtifact: 0,
              researchFallbackTemporarilyIneligible: true,
              checkpointDecision: `XA2X exact carrier run ${run} passed all required gates; advance directly to XA3 Red Team.`
            };
          } else {
            xa2.status = 'blocked';
            xa2x.status = 'blocked';
            xa2x.blockedReason = `Exact carrier run ${run} did not pass every gate: ${outcomeSummary}`;
            const recoveryId = 'R6-XA2Y-CLAUDE-BLUE-VERIFICATION-RECOVERY';
            let recovery = plan.assignments.find(a => a.id === recoveryId);
            if (!recovery) {
              recovery = {
                id: recoveryId,
                worker: 3,
                claimableByAnyEligibleWorker: true,
                intendedRole: 'builder-test-verifier',
                status: 'ready',
                program: 'MOBILE-SHELL-STRUCTURAL',
                goal: 'Inspect the exact XA2X failed gate/log and make the smallest candidate or carrier repair without broadening semantics, then rerun the exact matrix.',
                dependencies: ['R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY:blocked'],
                allowedFiles: ['tests/**','.github/workflows/**','.gitl/evidence/round-6/**','.gitl/orchestration/round-plan.json','.gitl/autopilot-state.json'],
                prohibitedActions: ['live Claude activation','weakening Send/CHOICE/route/lease/uncertainty','weakening demotion/clipping/exact-identity assertions','main/merge/auto-merge/tag/release/publish'],
                acceptanceCriteria: ['classify failed gate as candidate or carrier failure from exact log','make only the smallest repair','rerun failed gate plus required XA2X matrix','record exact head/run/job/artifact'],
                requiredTests: ['the failed XA2X gate','full XA2X exact verification matrix'],
                fallbackWork: 'If the failure is infrastructure-only, repair only the carrier and preserve candidate semantics.',
                evidencePath: '.gitl/evidence/round-6/claude-blue-prototype-verify-recovery.md'
              };
              plan.assignments.push(recovery);
            } else recovery.status = 'ready';
            plan.dispatch = {
              ...(plan.dispatch || {}),
              nextWake: 'earliest eligible wake',
              nominalWorker: 3,
              assignmentId: recoveryId,
              automatic: true,
              claimableByAnyEligibleWorker: true,
              instruction: 'Inspect the exact XA2X failure and perform the smallest bounded candidate-or-carrier repair; do not research.'
            };
            plan.deliveryPressure = {
              ...(plan.deliveryPressure || {}),
              checkpointStatus: 'claude-blue-exact-verification-failed-recovery-ready',
              researchOnlyWakesSinceLastProductTestPackageArtifact: 0,
              researchFallbackTemporarilyIneligible: true,
              checkpointDecision: `XA2X run ${run} exposed a concrete failed gate; preserve it and execute XA2Y recovery before research.`
            };
          }
          fs.writeFileSync(planPath, JSON.stringify(plan, null, 2) + '\n');

          const statePath = '.gitl/autopilot-state.json';
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const pass = result === 'PASS';
          state.currentStep = pass
            ? `R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY passed exact-head repository verification on run ${run}. XA2 and XA2X are submitted at deterministic fixture scope; live Claude/ChatGPT structural insertion remains UNKNOWN. R6-XA3-CROSS-ADAPTER-REDTEAM is ready.`
            : `R6-XA2X-CLAUDE-BLUE-PROTOTYPE-VERIFY run ${run} exposed a concrete verification failure (${outcomeSummary}). XA2/XA2X remain blocked and the smallest XA2Y verification recovery is ready.`;
          state.nextAction = pass
            ? 'Execute R6-XA3-CROSS-ADAPTER-REDTEAM before any research. Falsify specialized-first selection/demotion across ChatGPT+Claude and preserve exact Send/route/lease/resource invariants.'
            : 'Execute R6-XA2Y-CLAUDE-BLUE-VERIFICATION-RECOVERY before any research. Use exact carrier logs to classify candidate vs infrastructure failure and make only the smallest repair.';
          state.automaticDispatch = {
            ...(state.automaticDispatch || {}),
            enabled: true,
            scheduledFor: 'next eligible wake',
            nominalWorker: pass ? 4 : 3,
            assignmentId: pass ? 'R6-XA3-CROSS-ADAPTER-REDTEAM' : 'R6-XA2Y-CLAUDE-BLUE-VERIFICATION-RECOVERY',
            claimableByAnyEligibleWorker: true
          };
          state.researchFallback = {
            ...(state.researchFallback || {}),
            temporarilyIneligible: true,
            reason: pass ? 'XA3 cross-adapter Red Team is executable; research may not compete.' : 'XA2Y concrete verification recovery is executable; research may not compete.'
          };
          state.deliveryPressure = {
            ...(state.deliveryPressure || {}),
            checkpointStatus: pass ? 'claude-blue-verified-cross-adapter-redteam-ready' : 'claude-blue-exact-verification-failed-recovery-ready',
            researchOnlyWakesSinceLastProductTestPackageArtifact: 0,
            researchFallbackTemporarilyIneligible: true,
            nextArtifactAssignment: pass ? 'R6-XA3-CROSS-ADAPTER-REDTEAM' : 'R6-XA2Y-CLAUDE-BLUE-VERIFICATION-RECOVERY',
            lastTestableArtifactAt: finished,
            lastDeliveryDecision: pass ? `XA2X exact run ${run} passed; advance directly to XA3 Red Team.` : `XA2X exact run ${run} exposed a concrete failed gate; execute XA2Y smallest recovery before research.`,
            evidence: '.gitl/evidence/round-6/claude-blue-prototype-verify.md'
          };
          state.programStatus = {
            ...(state.programStatus || {}),
