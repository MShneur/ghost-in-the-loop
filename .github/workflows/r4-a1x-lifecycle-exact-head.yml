name: R4 A1X Lifecycle Exact Head

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - '.github/workflows/r4-a1x-lifecycle-exact-head.yml'
  pull_request:
    branches:
      - gitl/r3-a3-ci-base
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "${GITHUB_HEAD_REF}" = "agent/8.8-repair-resume"
          else
            test "${GITHUB_REF_NAME}" = "agent/8.8-repair-resume"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused lifecycle contract tests
        run: npx jest tests/wake-recovery.test.js tests/lifecycle-recovery-contract.test.js --runInBand
