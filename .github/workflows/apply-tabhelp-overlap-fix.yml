name: Apply tab-help overlap fix

on:
  push:
    branches:
      - agent/certification-preflight
    paths:
      - scripts/apply-tabhelp-overlap-fix.js
      - .github/workflows/apply-tabhelp-overlap-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certification-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic source patch
        run: node scripts/apply-tabhelp-overlap-fix.js
      - name: Rebuild extension artifact
        run: npm run build:extension
      - name: Verify generated artifact
        run: npm run check:generated
      - name: Verify userscript syntax
        run: node --check ghost-in-the-loop.user.js
      - name: Install target browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Verify complete UI smoke in Chromium and Firefox
        run: npx playwright test tests/e2e/smoke/ui-smoke.spec.js --project=chromium --project=firefox
      - name: Commit verified layout fix
        shell: bash
        run: |
          if git diff --quiet -- ghost-in-the-loop.user.js extension; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-in-the-loop.user.js extension
          git commit -m "fix: reserve space for tab help controls"
          git push origin HEAD:agent/certification-preflight
