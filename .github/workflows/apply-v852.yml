name: Apply v8.5.2 loop observability

on:
  push:
    branches: [agent/v8.5.2-loop-observability]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v8.5.2-loop-observability

      - name: Reconstruct and apply patch
        run: |
          cat scripts/apply_v852.part* > /tmp/apply_v852.py
          python -m py_compile /tmp/apply_v852.py
          python /tmp/apply_v852.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate extension artifact
        run: npm run build:extension

      - name: Generated artifact parity
        run: npm run check:generated

      - name: Syntax checks
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Browser safety tests
        run: npm run test:e2e

      - name: Remove one-time patch bootstrap
        run: |
          rm -f scripts/apply_v852.part*
          rm -f .github/workflows/apply-v852.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix loop completion observability and Ghost reload"
          git push origin HEAD:agent/v8.5.2-loop-observability
