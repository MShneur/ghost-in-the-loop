name: R3 A2B Exact Head Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-exact-head:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/8.8-repair-resume'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: 5c057fe2235da50c23c800f7c345bc3814f01b3c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard exact head and active lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json','utf8'));
          if (s.lease?.holder !== 'scheduled-agent-4' || s.lease?.assignmentId !== 'R3-A2B-RR-TICKER-SINGLE-FLIGHT-REPAIR') throw new Error('lease guard failed');
          NODE

      - name: Install dependencies and browsers
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          npx playwright install --with-deps chromium firefox 2>&1 | tee /tmp/browser-install.log

      - name: Run exact-head parity, syntax, unit, and browser gates
        shell: bash
        run: |
          set +e
          npm run check:generated > /tmp/check-generated.log 2>&1; S1=$?
          npm run lint > /tmp/lint.log 2>&1; S2=$?
          npm test -- --runInBand > /tmp/unit.log 2>&1; S3=$?
          npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium > /tmp/chromium.log 2>&1; S4=$?
          npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium-mobile > /tmp/chromium-mobile.log 2>&1; S5=$?
          npx playwright test tests/e2e/repair-resume.spec.js --project=firefox > /tmp/firefox.log 2>&1; S6=$?
          printf 'check_generated=%s\nlint=%s\nunit=%s\nchromium=%s\nchromium_mobile=%s\nfirefox=%s\n' "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" | tee /tmp/status.txt
          if [ "$S1" -ne 0 ] || [ "$S2" -ne 0 ] || [ "$S3" -ne 0 ] || [ "$S4" -ne 0 ] || [ "$S5" -ne 0 ] || [ "$S6" -ne 0 ]; then exit 1; fi

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/r3-a2b-exact-head
          for f in npm-ci.log browser-install.log check-generated.log lint.log unit.log chromium.log chromium-mobile.log firefox.log status.txt; do
            if [ -f "/tmp/$f" ]; then cp "/tmp/$f" "/tmp/r3-a2b-exact-head/$f"; fi
          done
          printf 'tested_head=%s\nexpected_head=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_HEAD" > /tmp/r3-a2b-exact-head/head.txt

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-a2b-exact-head-evidence
          path: /tmp/r3-a2b-exact-head
          if-no-files-found: error
          retention-days: 7
