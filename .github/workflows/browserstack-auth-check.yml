name: BrowserStack Ghost send-evidence probe

on:
  push:
    branches:
      - test/browserstack-auth-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browserstack-firefox-send-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen 8.8 staging payload read-only
        uses: actions/checkout@v4
        with:
          ref: release/8.8.0-staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run privacy-safe pre-dispatch evidence semantics on BrowserStack Firefox
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');
          const playwrightVersion = require('@playwright/test/package.json').version;

          (async () => {
            const raw = fs.readFileSync('ghost-in-the-loop.user.js', 'utf8')
              .replace(/\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/m, '');
            const expose = `
              window.__GITL_TestSend = async (text) => {
                PLAT.reviewed = true;
                PLAT.input = ['#composer'];
                PLAT.send = ['#send'];
                PLAT.stop = ['#stop'];
                PLAT.assistant = ['#assistant'];
                PLAT.dispatchFallback = null;
                PLAT.useCE = false;
                PLAT.useNS = false;
                Object.assign(GHOST.loop, {
                  state: 'RUNNING', phase: 'idle', isSending: false,
                  sendPending: false, sendTxn: null, round: 0
                });
                claimTabLock();
                const pending = engineSend(text, true);
                setTimeout(() => {
                  const observed = _sendEvidence();
                  if (observed.confirmed) _confirmSend(observed.evidence);
                }, 800);
                return pending;
              };
              window.__GITL_TestState = () => ({
                round: GHOST.loop.round,
                path: GHOST.loop.sendTxn && GHOST.loop.sendTxn.path,
                pending: GHOST.loop.sendPending
              });
            `;
            const script = /\n\} catch\(__gitlBootErr\)/.test(raw)
              ? raw.replace(/\n\} catch\(__gitlBootErr\)/, '\n' + expose + '\n} catch(__gitlBootErr)')
              : raw.replace(/(\}\)\(\)\s*;?\s*)$/, expose + '\n$1');
            const gm = `
              window.__gmStore = {};
              window.GM_getValue = (k, d) => (window.__gmStore[k] !== undefined ? window.__gmStore[k] : d);
              window.GM_setValue = (k, v) => { window.__gmStore[k] = v; };
              window.GM_addStyle = css => { const s=document.createElement('style'); s.textContent=css; (document.head||document.documentElement).appendChild(s); };
            `;
            const pageUrl = `data:text/html,${encodeURIComponent(`<!doctype html><html><body><main><div id="assistant">Prior response.</div><textarea id="composer"></textarea><button id="send" aria-label="Send message">Send</button></main></body></html>`)}`;

            const caps = {
              browser: 'playwright-firefox',
              os: 'Windows',
              os_version: '11',
              name: 'Ghost 8.8 BrowserStack pre-dispatch evidence semantics',
              build: `ghost-next-browserstack-${process.env.GITHUB_RUN_ID}`,
              project: 'Ghost in the Loop next-update verification',
              'browserstack.username': process.env.BROWSERSTACK_USERNAME,
              'browserstack.accessKey': process.env.BROWSERSTACK_ACCESS_KEY,
              'client.playwrightVersion': playwrightVersion,
              'browserstack.playwrightVersion': playwrightVersion,
              'browserstack.console': 'errors',
              'browserstack.networkLogs': 'false',
              'browserstack.video': 'true'
            };
            if (!caps['browserstack.username'] || !caps['browserstack.accessKey']) {
              throw new Error('BrowserStack GitHub secrets are missing.');
            }

            let browser;
            try {
              browser = await chromium.connect({
                wsEndpoint: `wss://cdp.browserstack.com/playwright?caps=${encodeURIComponent(JSON.stringify(caps))}`,
                timeout: 90000
              });
              const context = await browser.newContext({ viewport: { width: 412, height: 915 } });

              async function boot() {
                const page = await context.newPage();
                const pageErrors = [];
                page.on('pageerror', err => pageErrors.push(String(err && (err.stack || err.message || err))));
                await page.addInitScript(gm);
                await page.addInitScript(script);
                await page.goto(pageUrl, { waitUntil: 'domcontentloaded' });
                await page.waitForTimeout(700);
                if (pageErrors.length) throw new Error(`Page errors during boot: ${pageErrors.join(' | ')}`);
                return { page, pageErrors };
              }

              // Existing release test semantics, scenario A: dropped composer text must never actuate Send.
              {
                const { page, pageErrors } = await boot();
                await page.evaluate(() => {
                  window.__sendClicks = 0;
                  document.getElementById('send').addEventListener('click', () => { window.__sendClicks += 1; });
                  const input = document.getElementById('composer');
                  Object.defineProperty(input, 'value', { configurable: true, get: () => '', set: () => {} });
                });
                const delivered = await page.evaluate(() => window.__GITL_TestSend('Complete staged prompt'));
                const result = await page.evaluate(() => ({
                  clicks: window.__sendClicks,
                  state: window.__GITL_TestState(),
                  report: window.__gmStore.lastDiagnostic || ''
                }));
                if (delivered !== false || result.clicks !== 0 || result.state.pending !== false || !result.report.includes('COMPOSER-002')) {
                  throw new Error(`Dropped-text semantic mismatch: ${JSON.stringify({ delivered, result })}`);
                }
                if (pageErrors.length) throw new Error(`Dropped-text page errors: ${pageErrors.join(' | ')}`);
                console.log('BROWSERSTACK_SEND_EVIDENCE_NEGATIVE_PASS delivered=false clicks=0 pending=false diagnostic=COMPOSER-002');
                await page.close();
              }

              // Existing release test semantics, scenario B: verified text must dispatch exactly once through reviewed-button.
              {
                const { page, pageErrors } = await boot();
                await page.evaluate(() => {
                  window.__sendClicks = 0;
                  document.getElementById('send').addEventListener('click', () => {
                    window.__sendClicks += 1;
                    document.getElementById('composer').value = '';
                    const stop = document.createElement('button');
                    stop.id = 'stop';
                    stop.textContent = 'Stop';
                    document.body.appendChild(stop);
                  });
                });
                const delivered = await page.evaluate(() => window.__GITL_TestSend('Complete staged prompt'));
                const result = await page.evaluate(() => ({ clicks: window.__sendClicks, state: window.__GITL_TestState() }));
                const expected = { round: 1, path: 'reviewed-button', pending: false };
                if (delivered !== true || result.clicks !== 1 || JSON.stringify(result.state) !== JSON.stringify(expected)) {
                  throw new Error(`Verified-send semantic mismatch: ${JSON.stringify({ delivered, result })}`);
                }
                if (pageErrors.length) throw new Error(`Verified-send page errors: ${pageErrors.join(' | ')}`);
                console.log('BROWSERSTACK_SEND_EVIDENCE_POSITIVE_PASS delivered=true clicks=1 path=reviewed-button round=1 pending=false');
                await page.close();
              }

              console.log(`BROWSERSTACK_SEND_EVIDENCE_PARITY_PASS browser=playwright-firefox os=Windows-11 playwright=${playwrightVersion}`);
              await context.close();
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => {
            console.error(error && (error.stack || error.message || error));
            process.exitCode = 1;
          });
          NODE
