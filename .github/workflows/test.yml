name: Ghost in the Loop — CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests and Base Certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Parity must be checked on the committed bytes, before any step can
      # rewrite them — that artifact is what a clone/zip install actually runs.
      - name: Verify committed extension artifact matches source
        run: npm run check:generated
      - name: Certify extension artifacts
        run: npm run cert:base
      # Guards the invariant rather than one ordering mistake: if any cert step
      # ever rewrites the artifact again, this fails instead of hiding it.
      - name: Assert certification did not mutate the artifact
        run: npm run check:clean-tree
      - name: Syntax checks
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Run BUILD-IDENTITY oracle
        run: npm run identity:oracle
      - name: Build and verify release-candidate package
        run: npm run package:oracle
      - name: Upload release candidate package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-package
          path: test-results/release-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload base certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-base-certification
          path: test-results/extension-artifact-index.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Boot and Send-Safety Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        # Both engines: the v8.1.x Gemini failure went undiagnosed for weeks
        # because e2e ran Chromium-only while the field failure was Firefox
        # (Trusted Types). playwright.config.js advertises the Firefox project
        # only when a Firefox build is present, so installing it here is what
        # makes CI actually run the Gecko matrix.
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser safety tests
        run: npm run test:e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            test-results/
          retention-days: 7
