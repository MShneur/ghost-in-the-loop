name: Ghost in the Loop — CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-answer-selection:
    name: Apply verified v8.5.3 item 1
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v8.5.3-answer-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8.5.3-answer-selection
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Apply narrow source patch
        run: node scripts/apply-v853-answer-selection.cjs
      - name: Install dependencies
        run: npm ci
      - name: Regenerate Firefox artifact
        run: npm run build:extension
      - name: Verify syntax and unit behavior
        run: |
          npm run lint
          npm run test:unit -- --runInBand
          npm run check:generated
      - name: Restore CI and commit verified item
        run: |
          git show origin/main:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f scripts/apply-v853-answer-selection.cjs
          rm -f .github/workflows/apply-v853-answer-selection.yml
          rm -f tests/answerselection853.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: select the latest Perplexity answer reliably'
          git push origin HEAD:agent/v8.5.3-answer-selection

  unit:
    name: Unit Tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generated-artifact parity
        run: npm run check:generated
      - name: Syntax checks
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: E2E Boot and Send-Safety Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser safety tests
        run: npm run test:e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            test-results/
          retention-days: 7
