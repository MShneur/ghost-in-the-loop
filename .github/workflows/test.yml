name: Ghost in the Loop — CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests and Base Certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build and certify extension artifacts
        run: npm run cert:base
      - name: Syntax checks
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Upload base certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-base-certification
          path: test-results/extension-artifact-index.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Boot and Send-Safety Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        # Both engines: the v8.1.x Gemini failure went undiagnosed for weeks
        # because e2e ran Chromium-only while the field failure was Firefox
        # (Trusted Types). playwright.config.js advertises the Firefox project
        # only when a Firefox build is present, so installing it here is what
        # makes CI actually run the Gecko matrix.
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser safety tests
        run: npm run test:e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            test-results/
          retention-days: 7

  xa2x:
    name: XA2X Claude Blue Exact Verification
    if: "${{ github.actor != 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'test(gitl): arm XA2X via registered CI') }}"
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Repair malformed canonical state bootstrap
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = '.gitl/autopilot-state.json';
          let s = fs.readFileSync(p, 'utf8');
          try {
            JSON.parse(s);
          } catch (originalError) {
            const lines = s.split('\n');
            let repaired = 0;
            for (let i = 1; i < lines.length; i++) {
              if (lines[i].trim() !== '],') continue;
              let j = i - 1;
              while (j >= 0 && lines[j].trim() === '') j--;
              if (j < 0) continue;
              const t = lines[j].trim();
              if (t.startsWith('{') && t.endsWith('"') && !t.endsWith('}"')) {
                lines[j] += '}';
                repaired++;
              }
            }
            s = lines.join('\n');
            if (!repaired) throw originalError;
            JSON.parse(s);
            fs.writeFileSync(p, s);
            console.log(`Repaired ${repaired} malformed state object terminator(s).`);
          }
          NODE
      - name: Recover lease, claim XA2X, and run exact gates
        id: xa2xtest
        shell: bash
        run: bash .github/xa2x-run.sh test
      - name: Upload XA2X exact-head evidence
        id: xa2xupload
        if: always() && steps.xa2xtest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r6-xa2x-${{ github.run_id }}
          path: |
            test-results/
            e2e-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Bind run job artifact, reconcile state and plan, and self-remove
        if: always() && steps.xa2xtest.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_OUTCOME: ${{ steps.xa2xupload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" = success ]; then export UPLOAD_CODE=0; else export UPLOAD_CODE=1; fi
          bash .github/xa2x-run.sh finalize
