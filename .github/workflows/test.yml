name: Ghost in the Loop — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run lint
      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E Browser Matrix (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        # Both engines: the v8.1.x Gemini failure went undiagnosed for weeks
        # because e2e ran Chromium-only while the field failure was Firefox
        # (Trusted Types). playwright.config.js advertises the Firefox project
        # only when a Firefox build is present, so installing it here is what
        # makes CI actually run the Gecko matrix.
        run: npx playwright install --with-deps chromium firefox
      - name: Run e2e boot tests
        run: npm run test:e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            dev/e2e-results.json
            dev/test-results/
          retention-days: 7
