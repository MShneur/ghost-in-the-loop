name: Ghost in the Loop — CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests and Base Certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build and certify extension artifacts
        run: npm run cert:base
      - name: Syntax checks
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Upload base certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-base-certification
          path: test-results/extension-artifact-index.json
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Boot and Send-Safety Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        # Both engines: the v8.1.x Gemini failure went undiagnosed for weeks
        # because e2e ran Chromium-only while the field failure was Firefox
        # (Trusted Types). playwright.config.js advertises the Firefox project
        # only when a Firefox build is present, so installing it here is what
        # makes CI actually run the Gecko matrix.
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser safety tests
        run: npm run test:e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            test-results/
          retention-days: 7

  # XA5Y_REGISTERED_START
  xa5y:
    name: XA5Y test-only recovery
    if: github.actor != 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'ci(gitl): arm XA5Y via registered CI')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: agent/8.8-repair-resume
      ASSIGNMENT: R6-XA5Y-ORDINARY-E2E-ROUTING-TEST-RECOVERY
      HOLDER: gha-r6-xa5y-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and claim canonical lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          ACQUIRED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EXPIRES=$(date -u -d '+45 minutes' +'%Y-%m-%dT%H:%M:%SZ')
          INSPECTED=$(git rev-parse HEAD)
          export ACQUIRED EXPIRES INSPECTED
          node <<'NODE'
          const fs = require('fs');
          const statePath = '.gitl/autopilot-state.json';
          const state = JSON.parse(fs.readFileSync(statePath,'utf8'));
          const plan = JSON.parse(fs.readFileSync('.gitl/orchestration/round-plan.json','utf8'));
          if (state.status !== 'active' || state.publishReady || state.branch !== process.env.BRANCH) throw new Error('Project is not XA5Y-eligible');
          if (state.lease) throw new Error(`Conflicting lease: ${state.lease.holder} / ${state.lease.assignmentId}`);
          const xa5y = plan.assignments.find(a => a.id === process.env.ASSIGNMENT);
          const xa5x = plan.assignments.find(a => a.id === 'R6-XA5X-CI-HYGIENE-RECOVERY');
          if (!xa5y || xa5y.status !== 'ready' || !xa5x || xa5x.status !== 'blocked') throw new Error('XA5Y canonical dependency state changed');
          state.lease = {
            holder: process.env.HOLDER,
            assignmentId: process.env.ASSIGNMENT,
            nominalWorker: 5,
            executedRole: 'successor-test-engineer-ci-repair-with-mobile-browser-lens',
            acquiredAt: process.env.ACQUIRED,
            expiresAt: process.env.EXPIRES,
            inspectedHead: process.env.INSPECTED,
            activeWorkCheck: 'XA5Y ready, lease null, branch stable on registered-CI arm head. Prior standalone carrier bootstrap did not claim or mutate canonical state; registered carrier first mutation is this lease claim.'
          };
          state.currentStep = 'R6-XA5Y claimed to repair only the three XA5X-classified ordinary-E2E test routing/structure faults. Product source and existing safety/performance thresholds remain out of scope.';
          state.nextAction = 'Apply only the two Playwright project-routing corrections and the Repo-Nanny top-level test-structure correction, then hand off exact clean-head CI verification.';
          fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitl/autopilot-state.json
          git commit -m 'chore(gitl): claim XA5Y ordinary E2E recovery lease'
          git push origin HEAD:"$BRANCH"

      - name: Apply the three test-only repairs and create clean target
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          CLAIM_SHA=$(git rev-parse HEAD)
          export CLAIM_SHA
          node <<'NODE'
          const fs = require('fs');
          let config = fs.readFileSync('playwright.config.js','utf8');
          const anchor = "const projects = [\n";
          const routing = "const rootLifecycleMobilePerf = /[\\\\/]tests[\\\\/]e2e[\\\\/]lifecycle-mobile-perf\\.spec\\.js$/;\nconst chromiumOnlyLongChatA2 = /[\\\\/]tests[\\\\/]e2e[\\\\/]long-chat-perf-a2\\.spec\\.js$/;\n\n";
          if (!config.includes(anchor)) throw new Error('playwright config anchor missing');
          if (!config.includes('const rootLifecycleMobilePerf')) config = config.replace(anchor, routing + anchor);
          const chromiumAnchor = "    name: 'chromium',\n    use: {";
          const firefoxAnchor = "    name: 'firefox',\n    use: {";
          if (!config.includes(chromiumAnchor) || !config.includes(firefoxAnchor)) throw new Error('Playwright project anchors changed');
          config = config.replace(chromiumAnchor, "    name: 'chromium',\n    testIgnore: [rootLifecycleMobilePerf],\n    use: {");
          config = config.replace(firefoxAnchor, "    name: 'firefox',\n    testIgnore: [rootLifecycleMobilePerf, chromiumOnlyLongChatA2],\n    use: {");
          fs.writeFileSync('playwright.config.js', config);

          const sendPath = 'tests/e2e/repo-nanny/send-evidence.spec.js';
          let send = fs.readFileSync(sendPath,'utf8');
          const missingClose = "    expect(result.state).toEqual({ round: 1, path: 'reviewed-button', pending: false });\n  test('a block-normalized multiline contenteditable prompt verifies and dispatches once'";
          const redundantTail = "  });\n\n  });\n});\n";
          if (!send.includes(missingClose) || !send.includes(redundantTail)) throw new Error('Repo-Nanny structural signatures changed');
          send = send.replace(missingClose, "    expect(result.state).toEqual({ round: 1, path: 'reviewed-button', pending: false });\n  });\n\n  test('a block-normalized multiline contenteditable prompt verifies and dispatches once'");
          send = send.replace(redundantTail, "  });\n});\n");
          fs.writeFileSync(sendPath, send);

          let workflow = fs.readFileSync('.github/workflows/test.yml','utf8');
          workflow = workflow.replace(/\n  # XA5Y_REGISTERED_START[\s\S]*?\n  # XA5Y_REGISTERED_END\n?/, '\n');
          if (workflow.includes('XA5Y_REGISTERED_START') || workflow.includes('xa5y:')) throw new Error('Failed to self-remove XA5Y registered job');
          fs.writeFileSync('.github/workflows/test.yml', workflow);
          NODE

          node --check playwright.config.js
          node --check tests/e2e/repo-nanny/send-evidence.spec.js
          git diff --exit-code -- tests/e2e/lifecycle-mobile-perf.spec.js tests/e2e/long-chat-perf-a2.spec.js
          ! grep -q '^  xa2x:' .github/workflows/test.yml
          test ! -e .github/xa2x-run.sh
          git rm -f .github/workflows/r6-xa5y-recovery.yml .gitl/evidence/round-6/xa5y-recovery-trigger.md
          mkdir -p .gitl/evidence/round-6
          cat > .gitl/evidence/round-6/xa5y-test-fix.md <<EOF
          # Ghost Worker Evidence — R6 XA5Y Test Fix

          - Assignment: \`R6-XA5Y-ORDINARY-E2E-ROUTING-TEST-RECOVERY\`
          - Lease holder: \`${HOLDER}\`
          - Claim head: \`${CLAIM_SHA}\`
          - Product source changed: **NO**
          - \`playwright.config.js\`: root Pixel-class lifecycle fixture excluded from desktop Chromium and Firefox; R5 A2 timing oracle excluded from Firefox only.
          - \`tests/e2e/repo-nanny/send-evidence.spec.js\`: missing close restored so all three Send-evidence tests are top-level siblings; assertions unchanged.
          - \`tests/e2e/lifecycle-mobile-perf.spec.js\`: unchanged.
          - \`tests/e2e/long-chat-perf-a2.spec.js\`: unchanged, including every numerical threshold.
          - Stale XA2X runner/job residue: absent.
          - Temporary XA5Y carrier bootstrap: removed from the clean target.
          - Next evidence gate: ordinary \`Ghost in the Loop — CI\` on this clean target. No PASS is inferred before exact run/job/artifact evidence.

          ## Coordination deviation
          The connected contents API required carrier bootstrap commits before a runnable registered job could claim canonical state. Those bootstrap commits changed only temporary coordination/workflow files and are recorded explicitly. The first test/config mutation occurred only after the canonical XA5Y lease claim.
          EOF
          git add playwright.config.js tests/e2e/repo-nanny/send-evidence.spec.js .github/workflows/test.yml .gitl/evidence/round-6/xa5y-test-fix.md
          git diff --name-only "$CLAIM_SHA" | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/r6-xa5y-recovery.yml' '.github/workflows/test.yml' '.gitl/evidence/round-6/xa5y-recovery-trigger.md' '.gitl/evidence/round-6/xa5y-test-fix.md' 'playwright.config.js' 'tests/e2e/repo-nanny/send-evidence.spec.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'test(gitl): repair XA5Y ordinary E2E routing'
          FIX_SHA=$(git rev-parse HEAD)
          echo "fix_sha=$FIX_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:"$BRANCH"

      - name: Hand off clean-head CI verification and release lease
        shell: bash
        env:
          FIX_SHA: ${{ steps.fix.outputs.fix_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const statePath = '.gitl/autopilot-state.json';
          const planPath = '.gitl/orchestration/round-plan.json';
          const state = JSON.parse(fs.readFileSync(statePath,'utf8'));
          const plan = JSON.parse(fs.readFileSync(planPath,'utf8'));
          const xa5y = plan.assignments.find(a => a.id === process.env.ASSIGNMENT);
          if (!xa5y || !state.lease || state.lease.holder !== process.env.HOLDER) throw new Error('XA5Y lease/handoff state changed');
          xa5y.status = 'blocked';
          xa5y.executedBy = process.env.HOLDER;
          xa5y.fixCommit = process.env.FIX_SHA;
          xa5y.testedHead = process.env.FIX_SHA;
          xa5y.blockedReason = 'The three XA5X-classified test-only corrections are committed on a clean target; ordinary push CI was triggered but exact run/job/artifact verification is a separate dependency-safe handoff.';
          xa5y.evidencePath = '.gitl/evidence/round-6/xa5y-test-fix.md';

          let verify = plan.assignments.find(a => a.id === 'R6-XA5YZ-ORDINARY-CI-VERIFY');
          if (!verify) {
            verify = {
              id: 'R6-XA5YZ-ORDINARY-CI-VERIFY',
              worker: 4,
              claimableByAnyEligibleWorker: true,
              intendedRole: 'test-engineer-ci-verifier',
              status: 'ready',
              program: 'MOBILE-SHELL-STRUCTURAL',
              goal: 'Bind the ordinary clean-head CI run for the exact XA5Y test-fix head, then either retry the final bounded Round-6 audit on green or expose the smallest residual recovery on red.',
              dependencies: ['R6-XA5Y-ORDINARY-E2E-ROUTING-TEST-RECOVERY:blocked'],
              mandatoryReads: ['.gitl/evidence/round-6/xa5y-test-fix.md','.gitl/evidence/round-6/ci-carrier-hygiene-recovery.md'],
              allowedFiles: ['.gitl/**','.github/workflows/**'],
              prohibitedActions: ['product source changes','weakening Send/CHOICE/route/lease/uncertainty or existing timing/safety assertions','main/merge/auto-merge/tag/release/publish'],
              acceptanceCriteria: ['identify the exact ordinary push run for XA5Y fixCommit','verify unit/base and full E2E conclusions plus artifacts/logs','if green submit XA5Y and retry final bounded audit','if red classify exact residual failure and create only the smallest recovery'],
              requiredTests: ['exact GitHub Actions run/job/artifact/log bindings'],
              evidencePath: '.gitl/evidence/round-6/xa5yz-clean-head-ci-verify.md'
            };
            plan.assignments.push(verify);
          } else verify.status = 'ready';
          plan.dispatch = { nextWake: 'earliest eligible wake', nominalWorker: 4, assignmentId: verify.id, automatic: true, claimableByAnyEligibleWorker: true, instruction: 'Verify ordinary clean-head CI for the exact XA5Y test-fix head before research or BUILD-IDENTITY; classify any residual failure without weakening assertions.' };
          plan.deliveryPressure.checkpointStatus = 'xa5y-test-fix-committed-clean-ci-verification-ready';
          plan.deliveryPressure.researchOnlyWakesSinceLastProductTestPackageArtifact = 0;
          plan.deliveryPressure.researchFallbackTemporarilyIneligible = true;
          plan.deliveryPressure.reenableCondition = 'Research remains lower priority while XA5YZ clean-head CI verification is ready.';
          plan.deliveryPressure.checkpointDecision = 'XA5Y committed only the three classified test routing/structure corrections. Bind the ordinary clean-head run before final audit or BUILD-IDENTITY.';
          plan.roundDecision = 'xa5y-test-fix-committed-clean-ci-verification-ready-live-claims-pending';

          state.currentStep = `R6-XA5Y committed only the three classified test routing/structure corrections on clean head ${process.env.FIX_SHA}; product source and existing safety/performance thresholds are unchanged. Ordinary clean-head CI is now the exact evidence gate.`;
          state.nextAction = 'Execute R6-XA5YZ-ORDINARY-CI-VERIFY before research or BUILD-IDENTITY. Bind the exact ordinary push run for the XA5Y fix head; on green retry the final bounded Round-6 audit, on red create only the smallest residual recovery.';
          state.automaticDispatch.assignmentId = verify.id;
          state.automaticDispatch.nominalWorker = 4;
          state.researchFallback.temporarilyIneligible = true;
          state.researchFallback.reason = 'XA5YZ clean-head CI verification is executable; research may not compete.';
          state.deliveryPressure.checkpointStatus = 'xa5y-test-fix-committed-clean-ci-verification-ready';
          state.deliveryPressure.researchOnlyWakesSinceLastProductTestPackageArtifact = 0;
          state.deliveryPressure.researchFallbackTemporarilyIneligible = true;
          state.deliveryPressure.nextArtifactAssignment = verify.id;
          state.deliveryPressure.lastTestableArtifactAt = new Date().toISOString();
          state.deliveryPressure.lastDeliveryDecision = 'XA5Y test-only fix is committed. Verify ordinary clean-head CI before final audit or BUILD-IDENTITY; do not research.';
          state.deliveryPressure.evidence = '.gitl/evidence/round-6/xa5y-test-fix.md';
          state.programStatus['MOBILE-SHELL-STRUCTURAL'] = 'active-xa5y-test-fix-clean-ci-verification-ready-live-certification-pending';
          state.verificationSummary.nextAssignment = verify.id;
          state.verificationSummary.xa5yStatus = 'blocked-clean-ci-verification-ready';
          state.verificationSummary.xa5yFixCommit = process.env.FIX_SHA;
          if (!state.testEvidence.includes('.gitl/evidence/round-6/xa5y-test-fix.md')) state.testEvidence.push('.gitl/evidence/round-6/xa5y-test-fix.md');
          state.lease = null;
          fs.writeFileSync(planPath, JSON.stringify(plan, null, 2) + '\n');
          fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
          NODE
          git add .gitl/orchestration/round-plan.json .gitl/autopilot-state.json
          git commit -m 'chore(gitl): hand off XA5Y fix to clean CI verification'
          git push origin HEAD:"$BRANCH"
  # XA5Y_REGISTERED_END
