name: R5 A1 Plan Handoff

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - .github/workflows/r5-a1-plan-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Repair dispatch consistency and push
        shell: bash
        run: |
          expected='${{ github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          node scripts/test-r5-a1-plan-handoff.cjs
          changed="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.gitl/orchestration/round-plan\.json|\.github/workflows/r5-a1-plan-handoff\.yml|scripts/test-r5-a1-plan-handoff\.cjs)$' | grep -q .; then
            echo 'unexpected coordination file change' >&2
            exit 1
          fi
          git config user.name 'ghost-in-the-loop[bot]'
          git config user.email 'ghost-in-the-loop[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(gitl): align Round 5 dispatch with A2'
          git push origin HEAD:agent/8.8-repair-resume
