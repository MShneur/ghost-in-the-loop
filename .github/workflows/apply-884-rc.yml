name: Apply and certify 8.8.4 RC

on:
  push:
    branches:
      - agent/8.8.4-release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded 8.8.4 source repair
        run: node scripts/apply-884-release-candidate.mjs

      - name: Carry tested Alpha/Beta/Gamma/Delta R3 fallback
        shell: bash
        run: |
          git fetch origin hotfix/8.8.3-r2-recovery-delta-send-ack
          git show origin/hotfix/8.8.3-r2-recovery-delta-send-ack:recovery/ghost-8.8.3-recovery-r3.user.js > recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i 's/Ghost in the Loop 8.8.3 Recovery R3/Ghost in the Loop 8.8.4 Recovery R3/' recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i 's/@version      8.8.3-r3/@version      8.8.4-r3/' recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i "s/gitl-883-recovery-r3/gitl-884-recovery-r3/g" recovery/ghost-8.8.4-recovery-r3.user.js

      - name: Regenerate Firefox extension
        run: npm run build:extension

      - name: Write candidate identity
        run: node scripts/build-identity.js --write .gitl/evidence/round-7/candidate-identity.json

      - name: Source and unit certification
        run: |
          npm run lint
          npm run test:unit
          npm run check:generated
          node scripts/certify-extension.js
          git diff --check

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Browser certification
        run: npm run test:e2e

      - name: Commit certified RC bytes to isolated branch
        shell: bash
        run: |
          git add ghost-in-the-loop.user.js extension/content.js extension/manifest.json package.json package-lock.json CHANGELOG.md .gitl/autopilot-state.json .gitl/evidence/round-7/candidate-identity.json tests/directives.test.js tests/e2e/chatgpt-live-regression.spec.js tests/committee-commit-ui.test.js tests/send-confirmation-884.test.js recovery/ghost-8.8.4-recovery-r3.user.js
          if git diff --cached --quiet; then
            echo 'No RC changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: assemble certified 8.8.4 release candidate'
          git push origin HEAD:agent/8.8.4-release-candidate
