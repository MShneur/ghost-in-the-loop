name: Round 6 A4 Mobile Perf Carrier

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - 'tests/e2e/.r6-a4-mobile-perf-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6-a4-mobile-perf
  cancel-in-progress: false

jobs:
  mobile-perf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Guard isolated branch and active A4 lease
        id: guard
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_LEASE_CLAIM: 9bd26aee6b15a7cd07eb104fca94ceb0fdced6ad
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/8.8-repair-resume"
          git merge-base --is-ancestor "$EXPECTED_LEASE_CLAIM" HEAD
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json', 'utf8'));
          if (s.branch !== 'agent/8.8-repair-resume') throw new Error('unexpected canonical branch');
          if (s.lease?.holder !== 'scheduled-worker-2-r6-a4-mobile-perf-17') throw new Error('expected A4 lease not held');
          if (s.lease?.assignmentId !== 'R6-A4-MOBILE-SHELL-MOBILE-PERF') throw new Error('unexpected leased assignment');
          NODE

      - name: Install dependencies
        id: npmci
        continue-on-error: true
        run: npm ci

      - name: Base certification
        id: base
        continue-on-error: true
        run: npm run cert:base

      - name: Syntax and lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit

      - name: Focused Send route lease safety
        id: safety
        continue-on-error: true
        run: npx jest tests/sendtransaction.test.js tests/repair-resume.test.js tests/tablock.test.js tests/sendsafety.test.js --runInBand

      - name: Install Chromium and Firefox
        id: browsers
        continue-on-error: true
        run: npx playwright install --with-deps chromium firefox

      - name: Re-run exact Blue structural baseline
        id: blue
        continue-on-error: true
        run: npx playwright test tests/e2e/mobile-shell-blue-prototype.spec.js --project=chromium --project=firefox

      - name: Re-run A3 Red Team baseline
        id: red
        continue-on-error: true
        run: npx playwright test tests/e2e/mobile-shell-blue-redteam.spec.js --project=chromium --project=firefox

      - name: Run A4 mobile accessibility performance fixture
        id: a4
        continue-on-error: true
        run: npx playwright test tests/e2e/mobile-shell-blue-mobile-perf.spec.js --project=chromium --project=firefox

      - name: Upload A4 evidence artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-a4-mobile-perf-${{ github.run_id }}
          path: |
            e2e-results.json
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Record durable A4 result and self-remove carrier
        if: always()
        shell: bash
        env:
          O_GUARD: ${{ steps.guard.outcome }}
          O_NPMCI: ${{ steps.npmci.outcome }}
          O_BASE: ${{ steps.base.outcome }}
          O_LINT: ${{ steps.lint.outcome }}
          O_UNIT: ${{ steps.unit.outcome }}
          O_SAFETY: ${{ steps.safety.outcome }}
          O_BROWSERS: ${{ steps.browsers.outcome }}
          O_BLUE: ${{ steps.blue.outcome }}
          O_RED: ${{ steps.red.outcome }}
          O_A4: ${{ steps.a4.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT=PASS
          for value in "$O_GUARD" "$O_NPMCI" "$O_BASE" "$O_LINT" "$O_UNIT" "$O_SAFETY" "$O_BROWSERS" "$O_BLUE" "$O_RED" "$O_A4"; do
            if [ "$value" != "success" ]; then RESULT=FAIL; fi
          done

          JOB_ID="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.jobs||[]).find(v=>v.name==='mobile-perf');process.stdout.write(x?String(x.id):'UNKNOWN')})" \
            || echo UNKNOWN)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p .gitl/evidence/round-6

          cat > .gitl/evidence/round-6/worker-5.md <<EOF
          # Ghost Worker Evidence

          ## Identity
          - Round: 6
          - Worker evidence slot: 5
          - Intended role: Mobile / browser / accessibility / performance
          - Executed by: \`scheduled-worker-2-r6-a4-mobile-perf-17\`
          - Assignment ID: \`R6-A4-MOBILE-SHELL-MOBILE-PERF\`
          - Started at: 2026-08-07T20:14:00Z
          - Finished at: $NOW

          ## State Read
          - Branch: \`agent/8.8-repair-resume\`
          - Lease claim commit: \`9bd26aee6b15a7cd07eb104fca94ceb0fdced6ad\`
          - A4 test-artifact commit: \`0716a99d4afa4ffb0c3b038fdae56604fe2bd881\`
          - Trigger/tested head: \`${GITHUB_SHA}\`
          - A3 predecessor: submitted after overflow-clipping repair PASS.

          ## Step Performed
          Added and executed a deterministic A4 mobile/browser/accessibility/performance fixture against the exact repaired Blue browser-side candidate blob. The fixture exercises Pixel-class Chromium emulation, a portable desktop-Firefox lane, 320 CSS px reflow, 200% text, reduced motion, deterministic VisualViewport resize signalling, orientation changes, native-control insertion/repair, ARIA semantics, cleanup/resource invariants, and Chromium-only 1x/4x/6x CPU-throttled stress. Hosted timing is descriptive only; the tests contain no post-hoc latency budget.

          ## Research Sources
          - Repository mobile-shell brief and A4 assignment define host-flow, narrow/mobile, keyboard/orientation, accessibility and performance gates.
          - Round-6 mobile-reflow evidence predeclares 320 CSS px, 200% text, VisualViewport-as-signal, and platform-claim limits.
          - Round-6 constrained-runtime evidence predeclares Chromium-only 1x/4x/6x CPU throttling with invariant-based PASS and descriptive timing only.
          - A3 evidence fixes the exact repaired candidate blob at \`53cc902428a3fc1496a83ad1bf0bd1bbe6752c84\`.

          ## Changes
          - Added \`tests/e2e/mobile-shell-blue-mobile-perf.spec.js\` in commit \`0716a99d4afa4ffb0c3b038fdae56604fe2bd881\`.
          - The test pins and executes the exact repaired Blue candidate browser body; it does not add live ChatGPT selectors or production binding.
          - Temporary workflow and trigger are removed by this result transaction.
          - Production userscript/extension behavior: unchanged.

          ## Tests
          - Guard: **$O_GUARD**
          - npm ci: **$O_NPMCI**
          - cert:base/generated parity: **$O_BASE**
          - lint: **$O_LINT**
          - full unit: **$O_UNIT**
          - focused Send/route/lease safety: **$O_SAFETY**
          - browser install: **$O_BROWSERS**
          - exact Blue Chromium+Firefox baseline: **$O_BLUE**
          - A3 Red Team Chromium+Firefox baseline: **$O_RED**
          - A4 mobile/accessibility/performance Chromium+Firefox: **$O_A4**
          - Carrier run: \`${GITHUB_RUN_ID}\`
          - Job ID: \`$JOB_ID\`
          - Artifact: \`${ARTIFACT_ID:-UNKNOWN}\`
          - Artifact digest: \`${ARTIFACT_DIGEST:-UNKNOWN}\`
          - Overall: **$RESULT**

          ## Acceptance Criteria
          - Pixel-class Chromium emulation: **$(if [ "$RESULT" = PASS ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)** — included in A4 fixture Chromium lane.
          - Portable desktop Firefox: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)** — desktop Firefox only; not GeckoView.
          - <=500 px / 320 CSS px / 200% text / reduced motion: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)**.
          - VisualViewport signal + orientation transitions: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)** — deterministic signal/viewport fixture, not a real IME claim.
          - In-flow mount, native controls reachable, exact Send identity, zero passive Send actuation: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)**.
          - Observer/listener/pending-repair cleanup and bounded resource counts: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)**.
          - Chromium CPU stress 1x/4x/6x with descriptive timing only: **$(if [ "$O_A4" = success ]; then echo PASS; else echo FAIL_OR_BLOCKED; fi)**.
          - Physical Android / Android WebView / GeckoView / real assistive technology / calibrated low-end hardware: **NOT TESTED / NOT CLAIMED**.
          - Live authenticated ChatGPT structural insertion: **NOT TESTED / UNKNOWN pending A1X**.

          ## Safety Checks
          - Send authority unchanged: YES.
          - CHOICE behavior unchanged: YES.
          - Route and lease safety unchanged: YES.
          - Uncertainty/fail-closed fallback unchanged: YES.
          - No \`main\`, merge, auto-merge, tag, publish, or release action: YES.

          ## Risks and Limits
          Pixel 7 here is Playwright/Chromium emulation, not a physical Android device. Firefox is desktop Playwright Firefox, not Firefox-Android/GeckoView. The VisualViewport case dispatches a deterministic resize signal and the orientation case changes hosted viewport geometry; neither certifies a real mobile IME/browser-toolbar combination. CPU throttling is Chromium-only and relative to the hosted runner. Live ChatGPT binding remains UNKNOWN until A1X current-host evidence is actually obtained.

          ## Recommended Next Action
          $(if [ "$RESULT" = PASS ]; then echo 'Mark A4 submitted and expose `R6-A5-MOBILE-SHELL-AUDIT`; do not return to research.'; else echo 'Keep A4 retry-ready. Inspect this run and make the smallest test/candidate repair for the concrete failure; do not skip to A5 or research.'; fi)

          ## Assignment Status
          - $(if [ "$RESULT" = PASS ]; then echo submitted; else echo 'retry-ready'; fi)
          EOF

          rm -f .github/workflows/r6-a4-mobile-perf-carrier.yml tests/e2e/.r6-a4-mobile-perf-trigger
          git config user.name "gitl-a4-carrier"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(gitl): record Round 6 A4 mobile/perf result"
          git push origin HEAD:agent/8.8-repair-resume
