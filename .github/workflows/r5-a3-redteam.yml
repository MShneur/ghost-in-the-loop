name: R5 A3 Long Chat Red Team

on:
  pull_request:
    branches:
      - gitl/r5-a3-redteam-base

permissions:
  contents: read

jobs:
  redteam:
    name: A3 exact adversarial long-chat
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: 73ec20832e6ae125fd38dd137f315ee695e186b6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Guard exact PR head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused answer-selection and Send-journal Jest
        run: npx jest tests/issuefixes.test.js tests/sendtransaction.test.js --runInBand
      - name: Exact adversarial and unchanged A2 Chromium fixtures
        run: npx playwright test tests/e2e/long-chat-redteam.spec.js tests/e2e/long-chat-perf-a2.spec.js --project=chromium
      - name: Upload Red Team evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-a3-long-chat-redteam
          path: |
            e2e-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
