name: Apply semantic composer verification fix

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - scripts/apply-composer-semantic-fix.js
      - .github/workflows/apply-composer-semantic-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/8.8-repair-resume
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic patch
        run: node scripts/apply-composer-semantic-fix.js

      - name: Regenerate extension artifact
        run: npm run build:extension

      - name: Focused composer evidence tests
        run: npx jest tests/repo-nanny/composer-evidence.test.js --runInBand

      - name: Syntax and generated parity
        run: |
          npm run lint
          npm run check:generated

      - name: Full unit suite
        run: npx jest --runInBand

      - name: Base extension certification
        run: npm run cert:base

      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-in-the-loop.user.js extension/content.js CHANGELOG.md tests/repo-nanny/composer-evidence.test.js tests/e2e/repo-nanny/send-evidence.spec.js
          git diff --cached --check
          git commit -m "fix: verify multiline rich-editor prompts semantically"
          git push origin HEAD:agent/8.8-repair-resume
