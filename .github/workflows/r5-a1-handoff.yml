name: R5 A1 Handoff

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - .github/workflows/r5-a1-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard and prepare atomic handoff
        shell: bash
        run: |
          expected='${{ github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
          node scripts/test-r5-a1-handoff.cjs

          changed="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.gitl/autopilot-state\.json|\.gitl/orchestration/round-plan\.json|\.github/workflows/r5-a1-handoff\.yml|scripts/test-r5-a1-handoff\.cjs)$' | grep -q .; then
            echo 'unexpected handoff file change' >&2
            exit 1
          fi

      - name: Commit and push logical handoff
        shell: bash
        run: |
          git config user.name 'ghost-in-the-loop[bot]'
          git config user.email 'ghost-in-the-loop[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(gitl): hand off Round 5 long-chat baseline'
          git push origin HEAD:agent/8.8-repair-resume

          handoff="$(git rev-parse HEAD)"
          node -e "const fs=require('fs'); const p='.gitl/autopilot-state.json'; const s=JSON.parse(fs.readFileSync(p,'utf8')); s.headAtLastHandoff=process.argv[1]; fs.writeFileSync(p,JSON.stringify(s,null,2)+'\\n');" "$handoff"
          git add .gitl/autopilot-state.json
          git commit -m 'chore(gitl): finalize Round 5 A1 handoff state'
          git push origin HEAD:agent/8.8-repair-resume
