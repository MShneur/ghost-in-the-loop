name: Ghost 8.8 BrowserStack missing-host probe

on:
  push:
    branches:
      - test/8.8-browserstack-host-expansion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browserstack-missing-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen 8.8 staging payload read-only
        uses: actions/checkout@v4
        with:
          ref: release/8.8.0-staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen test dependencies
        run: npm ci

      - name: Run non-actuating BrowserStack probes on previously uncovered hosts
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');
          const playwrightVersion = require('@playwright/test/package.json').version;

          const hosts = [
            { name: 'claude', url: 'https://claude.ai/' },
            { name: 'deepseek', url: 'https://chat.deepseek.com/' },
            { name: 'copilot', url: 'https://copilot.microsoft.com/' },
            { name: 'grok', url: 'https://grok.com/' }
          ];

          const baseRaw = fs.readFileSync('ghost-in-the-loop.user.js', 'utf8')
            .replace(/\/\/ ==UserScript==[\s\S]*?\/\/ ==\/UserScript==/m, '');
          const expose = `
            window.__GITL_LiveReadOnlyProbe = () => {
              let input = null, send = null, platform = null;
              try { input = Adapter.getInput(); } catch (_) {}
              try { send = Adapter.getSendBtn(); } catch (_) {}
              try { platform = PLAT && PLAT.label; } catch (_) {}
              return {
                platform,
                inputResolved: !!input,
                inputTag: input ? String(input.tagName || '').toLowerCase() : null,
                sendResolved: !!send
              };
            };
          `;
          const raw = /\n\} catch\(__gitlBootErr\)/.test(baseRaw)
            ? baseRaw.replace(/\n\} catch\(__gitlBootErr\)/, '\n' + expose + '\n} catch(__gitlBootErr)')
            : baseRaw;
          const gm = `
            window.__gmStore = {};
            window.GM_getValue = (k, d) => (window.__gmStore[k] !== undefined ? window.__gmStore[k] : d);
            window.GM_setValue = (k, v) => { window.__gmStore[k] = v; };
            window.GM_addStyle = css => { const s=document.createElement('style'); s.textContent=css; (document.head||document.documentElement).appendChild(s); };
            window.GM_setClipboard = () => {};
            window.GM_notification = () => {};
            window.unsafeWindow = window;
          `;

          (async () => {
            if (!process.env.BROWSERSTACK_USERNAME || !process.env.BROWSERSTACK_ACCESS_KEY) {
              throw new Error('BrowserStack GitHub secrets are missing.');
            }
            const caps = {
              browser: 'chrome',
              browser_version: 'latest',
              os: 'Windows',
              os_version: '11',
              name: 'Ghost 8.8 missing-host non-actuating probe',
              build: `ghost-8.8-missing-hosts-${process.env.GITHUB_RUN_ID}`,
              project: 'Ghost in the Loop release validation',
              'browserstack.username': process.env.BROWSERSTACK_USERNAME,
              'browserstack.accessKey': process.env.BROWSERSTACK_ACCESS_KEY,
              'client.playwrightVersion': playwrightVersion,
              'browserstack.playwrightVersion': playwrightVersion,
              'browserstack.console': 'errors',
              'browserstack.networkLogs': 'false',
              'browserstack.video': 'false'
            };

            const browser = await chromium.connect({
              wsEndpoint: `wss://cdp.browserstack.com/playwright?caps=${encodeURIComponent(JSON.stringify(caps))}`,
              timeout: 90000
            });
            const context = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            const productFailures = [];
            const unavailable = [];

            try {
              for (const host of hosts) {
                const page = await context.newPage();
                const pageErrors = [];
                page.on('pageerror', e => pageErrors.push(String(e && (e.message || e))));
                await page.addInitScript(gm);
                await page.addInitScript(raw);

                let navError = null;
                try {
                  await page.goto(host.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                } catch (e) {
                  navError = String(e && (e.message || e)).split('\n')[0];
                }
                await page.waitForTimeout(7000);

                const result = await page.evaluate(() => {
                  const visible = el => {
                    const r = el.getBoundingClientRect();
                    const cs = getComputedStyle(el);
                    return r.width > 0 && r.height > 0 && cs.display !== 'none' && cs.visibility !== 'hidden';
                  };
                  const textboxes = Array.from(document.querySelectorAll('textarea,[role="textbox"],[contenteditable="true"]')).filter(visible);
                  const controls = Array.from(document.querySelectorAll('a,button,[role="button"]'));
                  const loginSurface = controls.some(el => {
                    const s = String(el.getAttribute('aria-label') || el.getAttribute('title') || el.getAttribute('href') || el.textContent || '').toLowerCase();
                    return /login|log in|log-in|sign in|sign-in|signin|auth/.test(s);
                  });
                  let ghostProbe = null;
                  try { ghostProbe = window.__GITL_LiveReadOnlyProbe ? window.__GITL_LiveReadOnlyProbe() : null; } catch (_) {}
                  return {
                    origin: location.origin,
                    hostname: location.hostname,
                    pathClass: location.pathname.split('/').slice(0, 3).join('/'),
                    beacon: document.documentElement.getAttribute('data-gitl-boot'),
                    booted: window.__GITL_V8__ === true,
                    fatal: !!document.getElementById('gitl-fatal'),
                    textboxCount: textboxes.length,
                    loginSurface,
                    challengeSurface: !!document.querySelector('iframe[src*="captcha"],iframe[src*="challenge"],[id*="captcha" i],[class*="captcha" i],[id*="challenge" i]'),
                    ghostProbe
                  };
                }).catch(e => ({ evaluateError: String(e && (e.message || e)).split('\n')[0] }));

                const expectedHost = new URL(host.url).hostname;
                const redirected = result.hostname && result.hostname !== expectedHost;
                const safeErrors = pageErrors.slice(0, 3).map(x => x.replace(/https?:\/\/[^\s)]+/g, '[url]').slice(0, 220));
                console.log('BROWSERSTACK_MISSING_HOST_RESULT ' + JSON.stringify({
                  host: host.name,
                  expectedHost,
                  redirected,
                  navError,
                  ...result,
                  pageErrorCount: pageErrors.length,
                  pageErrors: safeErrors
                }));

                if (navError || redirected || result.evaluateError) {
                  unavailable.push(`${host.name}:${navError ? 'navigation' : redirected ? 'redirect' : 'evaluate'}`);
                } else {
                  const bootOk = result.booted && !result.fatal && String(result.beacon || '').startsWith('ok:8.8.0');
                  if (!bootOk) productFailures.push(`${host.name}:boot`);
                  if (result.textboxCount > 0 && (!result.ghostProbe || !result.ghostProbe.inputResolved)) {
                    productFailures.push(`${host.name}:visible-composer-not-resolved`);
                  }
                }
                await page.close();
              }
            } finally {
              await context.close();
              await browser.close();
            }

            console.log(`BROWSERSTACK_MISSING_HOST_SUMMARY product_failures=${productFailures.join(',') || 'none'} unavailable=${unavailable.join(',') || 'none'} actuation=none`);
            if (productFailures.length) throw new Error(`Ghost product failures: ${productFailures.join(',')}`);
          })().catch(err => {
            console.error(err && (err.stack || err.message || err));
            process.exitCode = 1;
          });
          NODE
