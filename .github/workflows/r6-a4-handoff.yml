name: Round 6 A4 Handoff

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - 'tests/e2e/.r6-a4-handoff-trigger'

permissions:
  contents: write

concurrency:
  group: r6-a4-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard completed A4 evidence and shared lease
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/8.8-repair-resume"
          git merge-base --is-ancestor c173205e1a7373de7065509a2053e26a108d50dc HEAD
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json','utf8'));
          const e = fs.readFileSync('.gitl/evidence/round-6/worker-5.md','utf8');
          if (s.lease?.holder !== 'scheduled-worker-2-r6-a4-mobile-perf-17') throw new Error('A4 lease no longer held');
          if (s.lease?.assignmentId !== 'R6-A4-MOBILE-SHELL-MOBILE-PERF') throw new Error('unexpected lease assignment');
          if (!e.includes('Overall: **PASS**') || !e.includes('Repair carrier run: `31215517114`')) throw new Error('durable A4 PASS evidence not found');
          NODE

      - name: Commit canonical A4 handoff and release lease
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const planPath = '.gitl/orchestration/round-plan.json';
          const statePath = '.gitl/autopilot-state.json';
          const plan = JSON.parse(fs.readFileSync(planPath,'utf8'));
          const state = JSON.parse(fs.readFileSync(statePath,'utf8'));
          const A4 = 'R6-A4-MOBILE-SHELL-MOBILE-PERF';
          const A5 = 'R6-A5-MOBILE-SHELL-AUDIT';
          const a4 = plan.assignments.find(x => x.id === A4);
          const a5 = plan.assignments.find(x => x.id === A5);
          if (!a4 || !a5) throw new Error('A4/A5 assignment missing');

          a4.status = 'submitted';
          a4.executedBy = 'scheduled-worker-2-r6-a4-mobile-perf-17';
          a4.testedHead = '096722a6688a3b5ff3dc1e20aa22ec799cafabdb';
          a4.resultCommit = 'c173205e1a7373de7065509a2053e26a108d50dc';
          a4.evidencePath = '.gitl/evidence/round-6/worker-5.md';
          a4.initialFailureRun = 31215306655;
          a4.initialFailureJob = 92987347838;
          a4.initialFailureArtifact = 9008274458;
          a4.initialFailureArtifactDigest = '43205f30b8082b09f6aff801c3a4d090531d9676ea50e909cc1a582e31e49db9';
          a4.repairCommit = '096722a6688a3b5ff3dc1e20aa22ec799cafabdb';
          a4.runId = 31215517114;
          a4.jobId = 92988007587;
          a4.artifactId = 9008352875;
          a4.artifactSha256 = '08555f208f2eaaf5e16318b0deb3975ec9f52947d65f21ff0b69730c678d5297';
          a4.blockedReason = null;
          a5.status = 'ready';

          plan.deliveryPressure.checkpointStatus = 'mobile-perf-pass-audit-ready';
          plan.deliveryPressure.researchOnlyWakesSinceLastProductTestPackageArtifact = 0;
          plan.deliveryPressure.researchFallbackTemporarilyIneligible = true;
          plan.deliveryPressure.checkpointDecision = 'A4 deterministic hosted mobile/accessibility/performance PASS after correcting an orientation-oracle double count; A5 independent audit is the next release-moving assignment.';
          plan.dispatch = {
            nextWake: 'earliest eligible wake',
            nominalWorker: 6,
            assignmentId: A5,
            automatic: true,
            claimableByAnyEligibleWorker: true,
            instruction: 'Execute the independent bounded Round-6 structural audit. Inspect exact A2/A3/A4 source and CI evidence, preserve live-host and physical-platform limits, and do not return to research while A5 is executable.'
          };

          state.headAtLastHandoff = 'c173205e1a7373de7065509a2053e26a108d50dc';
          state.currentStep = 'R6-A4-MOBILE-SHELL-MOBILE-PERF submitted. Initial hosted carrier run 31215306655 exposed a deterministic test-oracle error: Chromium emitted native orientationchange events in addition to the fixture injection. The smallest repair removed the injected duplicate and made viewport geometry the oracle. Repair carrier 31215517114 then passed base, lint, full unit, focused Send/route/lease safety, exact Blue and A3 Red Team baselines, and the A4 Chromium+Firefox mobile/accessibility/performance fixture. A5 audit is ready; live ChatGPT binding remains UNKNOWN pending A1X.';
          state.nextAction = 'Execute R6-A5-MOBILE-SHELL-AUDIT before any research. Independently audit exact A2/A3/A4 source and run bindings, preserve all explicit physical/live-host limits, and expose the next required structural expansion or smallest recovery.';
          state.automaticDispatch = {
            enabled: true,
            scheduledFor: 'next eligible wake',
            nominalWorker: 6,
            assignmentId: A5,
            claimableByAnyEligibleWorker: true,
            holdForbiddenReasons: state.automaticDispatch?.holdForbiddenReasons || [],
            holdRequiredReasons: state.automaticDispatch?.holdRequiredReasons || []
          };
          state.researchFallback.enabled = true;
          state.researchFallback.temporarilyIneligible = true;
          state.researchFallback.reason = 'A4 is submitted and A5 independent audit is executable; research may not compete with ready release certification work.';
          state.deliveryPressure.checkpointStatus = 'mobile-perf-pass-audit-ready';
          state.deliveryPressure.researchOnlyWakesSinceLastProductTestPackageArtifact = 0;
          state.deliveryPressure.researchFallbackTemporarilyIneligible = true;
          state.deliveryPressure.nextArtifactAssignment = A5;
          state.deliveryPressure.lastTestableArtifactAt = '2026-08-07T20:22:52Z';
          state.deliveryPressure.lastDeliveryDecision = 'A4 passed after a smallest test-oracle repair; advance directly to independent A5 audit.';
          state.deliveryPressure.evidence = '.gitl/evidence/round-6/worker-5.md';
          state.deliveryPressure.evidenceCommit = 'c173205e1a7373de7065509a2053e26a108d50dc';
          state.programStatus['MOBILE-SHELL-STRUCTURAL'] = 'active-prototype-mobile-perf-submitted-audit-ready-live-certification-pending';

          const stepType = 'round-6-a4-mobile-perf-orientation-oracle-repair-pass';
          if (!state.completedSteps.some(x => x.type === stepType)) {
            state.completedSteps.push({
              type: stepType,
              result: 'A4 initial run 31215306655/job 92987347838/artifact 9008274458 failed only on an exact orientation-event-count oracle because Chromium emitted native orientationchange plus the fixture injection. Repair commit 096722a6688a3b5ff3dc1e20aa22ec799cafabdb removed the injected duplicate and asserted geometry. Repair run 31215517114/job 92988007587/artifact 9008352875/digest 08555f208f2eaaf5e16318b0deb3975ec9f52947d65f21ff0b69730c678d5297 passed base/lint/unit/focused safety, Blue, Red Team, and A4 hosted Chromium+Firefox gates.'
            });
          }
          const findingType = 'mobile-shell-a4-hosted-mobile-perf-pass';
          if (!state.findings.some(x => x.type === findingType)) {
            state.findings.push({
              worker: 5,
              type: findingType,
              finding: 'The exact repaired deterministic Blue candidate passed hosted Pixel-class Chromium emulation, 320 CSS px, 200% text, reduced motion, portrait/landscape viewport geometry, deterministic VisualViewport signal, desktop Firefox semantics, resource cleanup, zero passive Send actuation, and Chromium 1x/4x/6x CPU invariant stress. The first carrier revealed and repaired only a double-counting orientation oracle. Physical Android/WebView/GeckoView/real IME/AT/calibrated hardware and live ChatGPT insertion remain uncertified.'
            });
          }
          if (!state.testEvidence.includes('.gitl/evidence/round-6/worker-5.md')) state.testEvidence.push('.gitl/evidence/round-6/worker-5.md');
          state.lease = null;
          state.blockedReason = null;

          const v = state.verificationSummary;
          v.verdict = 'prototype-mobile-perf-submitted-audit-ready-live-certification-pending';
          v.nextAssignment = A5;
          v.a4Status = 'submitted';
          v.a4Evidence = '.gitl/evidence/round-6/worker-5.md';
          v.a4TestedHead = '096722a6688a3b5ff3dc1e20aa22ec799cafabdb';
          v.a4InitialFailureRun = 31215306655;
          v.a4InitialFailureJob = 92987347838;
          v.a4RepairRun = 31215517114;
          v.a4RepairJob = 92988007587;
          v.a4RepairArtifact = 9008352875;
          v.a4RepairArtifactSha256 = '08555f208f2eaaf5e16318b0deb3975ec9f52947d65f21ff0b69730c678d5297';
          v.a4HostedResult = 'PASS: Pixel-class Chromium emulation, 320 CSS px, 200% text, reduced motion, portrait/landscape geometry, deterministic VisualViewport signal, portable desktop Firefox, exact Send/zero-actuation, cleanup/resources, and Chromium 1x/4x/6x invariant stress. Timing descriptive only.';
          v.platformClaimLimits = 'Physical Android, Android WebView, Firefox-Android/GeckoView, real IME/browser-toolbar combinations, real assistive-technology mappings, calibrated low-end-device performance, and exact current live ChatGPT structural insertion remain uncertified. Hosted deterministic desktop Firefox A2/A4 behavior is tested only at fixture scope and is not GeckoView certification.';
          v.interactionAccessibilityConstraints = 'Shadow DOM is not an event-safety boundary. The deterministic prototype keeps delegatesFocus false, does not autofocus on mount/repair, uses explicit type=button controls with local names, and A4 hosted Chromium+desktop-Firefox semantic/focus checks passed with exact Send identity and zero passive actuation. Physical AT mappings remain separately uncertified.';

          fs.writeFileSync(planPath, JSON.stringify(plan, null, 2) + '\n');
          fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
          NODE

          rm -f .github/workflows/r6-a4-handoff.yml tests/e2e/.r6-a4-handoff-trigger
          git config user.name "gitl-a4-handoff"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(gitl): submit Round 6 A4 and expose audit"
          git push origin HEAD:agent/8.8-repair-resume
