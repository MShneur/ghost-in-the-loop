name: Assemble and certify 8.8.4 field final

on:
  push:
    branches:
      - release/8.8.4-field-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded production repair
        run: |
          node scripts/apply-884-release-candidate.mjs
          sed -i 's#agent/8.8.4-release-candidate#release/8.8.4-field-final#g' .gitl/autopilot-state.json

      - name: Carry tested recovery fallback
        shell: bash
        run: |
          cp recovery/ghost-8.8.3-recovery-r3.user.js recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i 's/Ghost in the Loop 8.8.3 Recovery R3/Ghost in the Loop 8.8.4 Recovery R3/' recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i 's/@version      8.8.3-r3/@version      8.8.4-r3/' recovery/ghost-8.8.4-recovery-r3.user.js
          sed -i 's/gitl-883-recovery-r3/gitl-884-recovery-r3/g' recovery/ghost-8.8.4-recovery-r3.user.js

      - name: Regenerate extension
        run: npm run build:extension

      - name: Write candidate identity
        run: node scripts/build-identity.js --write .gitl/evidence/round-7/candidate-identity.json

      - name: Lint and syntax safety
        run: npm run lint

      - name: Unit diagnostics
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log

      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 884-field-unit-log
          path: unit.log
          if-no-files-found: ignore

      - name: Generated extension parity
        run: npm run check:generated

      - name: Extension certification
        run: node scripts/certify-extension.js

      - name: Diff whitespace check
        run: git diff --check

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Browser certification
        run: npm run test:e2e

      - name: Commit certified production bytes
        shell: bash
        run: |
          git add ghost-in-the-loop.user.js extension/content.js extension/manifest.json package.json package-lock.json CHANGELOG.md .gitl/autopilot-state.json .gitl/evidence/round-7/candidate-identity.json tests/directives.test.js tests/e2e/chatgpt-live-regression.spec.js tests/committee-commit-ui.test.js tests/send-confirmation-884.test.js recovery/ghost-8.8.4-recovery-r3.user.js recovery/ghost-8.8.3-recovery-r4-field.user.js
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: assemble 8.8.4 field final [assembled-884]'
          git push origin HEAD:release/8.8.4-field-final
