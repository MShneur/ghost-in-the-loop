name: R7 A2 Dependency Audit

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - .github/workflows/r7-a2-dependency-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify lease and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/8.8-repair-resume"
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('.gitl/autopilot-state.json', 'utf8'));
          if (!state.lease || state.lease.holder !== 'scheduled-worker-2-r7-a2-dependency-audit-11' || state.lease.assignmentId !== 'R7-A2-DEPENDENCY-AUDIT') {
            throw new Error(`lease mismatch: ${JSON.stringify(state.lease)}`);
          }
          NODE

      - name: Install exact lockfile
        run: npm ci

      - name: Capture lockfile-bound audit evidence
        shell: bash
        run: |
          set -u
          mkdir -p .gitl/evidence/round-7
          set +e
          npm audit --json > /tmp/npm-audit-full.json
          full_status=$?
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json
          prod_status=$?
          set -e
          FULL_STATUS="$full_status" PROD_STATUS="$prod_status" node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const full = JSON.parse(fs.readFileSync('/tmp/npm-audit-full.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('/tmp/npm-audit-prod.json', 'utf8'));
          const names = Object.keys(full.vulnerabilities || {}).sort();
          const explain = {};
          for (const name of names) {
            try {
              explain[name] = JSON.parse(cp.execFileSync('npm', ['explain', '--json', name], {encoding: 'utf8'}));
            } catch (error) {
              explain[name] = {error: String(error.message || error)};
            }
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const record = {
            schema: 'gitl-r7-a2-dependency-audit-v1',
            capturedAt: new Date().toISOString(),
            branch: process.env.GITHUB_REF_NAME,
            head: process.env.GITHUB_SHA,
            runId: Number(process.env.GITHUB_RUN_ID),
            job: 'audit',
            node: process.version,
            npm: cp.execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim(),
            packageJson: {
              dependencies: pkg.dependencies || {},
              devDependencies: pkg.devDependencies || {}
            },
            fullAuditExitStatus: Number(process.env.FULL_STATUS),
            productionOmitDevAuditExitStatus: Number(process.env.PROD_STATUS),
            fullAudit: full,
            productionOmitDevAudit: prod,
            explain
          };
          fs.writeFileSync('.gitl/evidence/round-7/dependency-audit.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify({
            head: record.head,
            runId: record.runId,
            fullMetadata: full.metadata,
            productionMetadata: prod.metadata,
            vulnerablePackages: names,
            fullAuditExitStatus: record.fullAuditExitStatus,
            productionOmitDevAuditExitStatus: record.productionOmitDevAuditExitStatus
          }, null, 2));
          NODE

      - name: Commit audit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gitl-r7-a2-audit"
          git config user.email "actions@users.noreply.github.com"
          git add .gitl/evidence/round-7/dependency-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "docs(gitl): capture R7 A2 dependency audit evidence"
          git push origin HEAD:agent/8.8-repair-resume
