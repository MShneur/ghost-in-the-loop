name: Apply wake recovery patch

on:
  push:
    branches:
      - agent/certification-preflight
    paths:
      - scripts/apply-wake-recovery.js
      - .github/workflows/apply-wake-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certification-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic source patch
        run: node scripts/apply-wake-recovery.js
      - name: Rebuild extension artifact
        run: npm run build:extension
      - name: Verify generated artifact
        run: npm run check:generated
      - name: Verify userscript syntax
        run: node --check ghost-in-the-loop.user.js
      - name: Run focused wake recovery contract
        run: npx jest tests/wake-recovery.test.js --runInBand
      - name: Commit patched source and generated extension
        shell: bash
        run: |
          if git diff --quiet -- ghost-in-the-loop.user.js extension; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-in-the-loop.user.js extension
          git commit -m "fix: recover runtime after mobile wake"
          git push origin HEAD:agent/certification-preflight
