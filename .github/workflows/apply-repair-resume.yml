name: Apply Repair and Resume

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - scripts/apply-repair-resume.js
      - .github/workflows/apply-repair-resume.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/8.8-repair-resume
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply reviewed patch
        run: |
          node --check scripts/apply-repair-resume.js
          node scripts/apply-repair-resume.js .
      - name: Build and certify generated extension
        run: npm run cert:base
      - name: Syntax and whitespace checks
        run: |
          npm run lint
          git diff --check
      - name: Run complete unit suite
        run: npm run test:unit
      - name: Commit verified implementation
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-in-the-loop.user.js extension/content.js CHANGELOG.md tests/setup.js tests/repair-resume.test.js
          if git diff --cached --quiet; then
            echo "Repair and Resume implementation already current"
            exit 0
          fi
          git commit -m "fix: add health-driven repair and resume"
          git push origin HEAD:agent/8.8-repair-resume
