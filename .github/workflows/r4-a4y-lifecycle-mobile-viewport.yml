name: R4 A4Y Lifecycle Mobile Viewport

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lifecycle-mobile-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"
          test "${GITHUB_HEAD_REF}" = "agent/8.8-repair-resume"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pixel 7 lifecycle mobile viewport fixture
        run: npx playwright test tests/e2e/lifecycle-mobile-perf.spec.js --project=chromium-mobile

      - name: Upload mobile viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-a4y-lifecycle-mobile-viewport-evidence
          path: |
            e2e-results.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
