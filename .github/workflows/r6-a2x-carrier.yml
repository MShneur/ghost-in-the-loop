name: Round 6 A2X Exact-Head Carrier

on:
  push:
    branches:
      - agent/8.8-repair-resume
    paths:
      - '.github/workflows/r6-a2x-carrier.yml'

permissions:
  contents: write

concurrency:
  group: r6-a2x-carrier
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Run guarded exact-head gates
        id: gates
        shell: bash
        env:
          EXPECTED_CANDIDATE: 64b2dd1792e3fb59331ea3f2fc72efb32ae0f3ec
        run: |
          set +e
          mkdir -p test-results/r6-a2x-carrier
          TESTED_HEAD="$(git rev-parse HEAD)"
          printf '%s\n' "$TESTED_HEAD" > test-results/r6-a2x-carrier/tested-head.txt

          git merge-base --is-ancestor "$EXPECTED_CANDIDATE" "$TESTED_HEAD"
          ANCESTOR_RC=$?
          git diff --name-only "$EXPECTED_CANDIDATE".."$TESTED_HEAD" > test-results/r6-a2x-carrier/descendant-files.txt
          if grep -Ev '^(\.gitl/|\.github/workflows/r6-a2x-carrier\.yml$)' test-results/r6-a2x-carrier/descendant-files.txt > test-results/r6-a2x-carrier/unexpected-files.txt; then
            SCOPE_RC=1
          else
            SCOPE_RC=0
          fi

          npm ci > test-results/r6-a2x-carrier/npm-ci.log 2>&1
          NPM_CI_RC=$?

          if [ "$NPM_CI_RC" -eq 0 ]; then
            npm run cert:base > test-results/r6-a2x-carrier/cert-base.log 2>&1
            CERT_RC=$?
            npm run lint > test-results/r6-a2x-carrier/lint.log 2>&1
            LINT_RC=$?
            npm run test:unit > test-results/r6-a2x-carrier/unit.log 2>&1
            UNIT_RC=$?
            npx playwright install --with-deps chromium firefox > test-results/r6-a2x-carrier/playwright-install.log 2>&1
            PW_INSTALL_RC=$?
            if [ "$PW_INSTALL_RC" -eq 0 ]; then
              npm run test:e2e > test-results/r6-a2x-carrier/e2e.log 2>&1
              E2E_RC=$?
            else
              E2E_RC=125
            fi
          else
            CERT_RC=125
            LINT_RC=125
            UNIT_RC=125
            PW_INSTALL_RC=125
            E2E_RC=125
          fi

          OVERALL_RC=0
          for code in "$ANCESTOR_RC" "$SCOPE_RC" "$NPM_CI_RC" "$CERT_RC" "$LINT_RC" "$UNIT_RC" "$PW_INSTALL_RC" "$E2E_RC"; do
            if [ "$code" -ne 0 ]; then OVERALL_RC=1; fi
          done

          cat > test-results/r6-a2x-carrier/status.env <<EOF
          TESTED_HEAD=$TESTED_HEAD
          EXPECTED_CANDIDATE=$EXPECTED_CANDIDATE
          ANCESTOR_RC=$ANCESTOR_RC
          SCOPE_RC=$SCOPE_RC
          NPM_CI_RC=$NPM_CI_RC
          CERT_RC=$CERT_RC
          LINT_RC=$LINT_RC
          UNIT_RC=$UNIT_RC
          PW_INSTALL_RC=$PW_INSTALL_RC
          E2E_RC=$E2E_RC
          OVERALL_RC=$OVERALL_RC
          EOF

          cat test-results/r6-a2x-carrier/status.env
          echo "overall_rc=$OVERALL_RC" >> "$GITHUB_OUTPUT"

      - name: Upload exact-head logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-a2x-exact-head-${{ github.run_id }}
          path: test-results/r6-a2x-carrier/
          retention-days: 7

      - name: Commit durable carrier result and self-remove
        if: always()
        shell: bash
        run: |
          set -e
          . test-results/r6-a2x-carrier/status.env
          RESULT=FAIL
          if [ "$OVERALL_RC" -eq 0 ]; then RESULT=PASS; fi
          mkdir -p .gitl/evidence/round-6
          cat > .gitl/evidence/round-6/a2x-carrier-result.md <<EOF
          # Round 6 A2X Exact-Head Carrier Result

          - Result: **$RESULT**
          - Tested head: \`$TESTED_HEAD\`
          - Required candidate ancestor: \`$EXPECTED_CANDIDATE\`
          - GitHub Actions run ID: \`$GITHUB_RUN_ID\`
          - GitHub Actions job: \`$GITHUB_JOB\`
          - Workflow: \`Round 6 A2X Exact-Head Carrier\`
          - Actor: \`$GITHUB_ACTOR\`
          - Branch: \`$GITHUB_REF_NAME\`

          ## Exit codes
          - candidate ancestor guard: \`$ANCESTOR_RC\`
          - descendant scope guard: \`$SCOPE_RC\`
          - npm ci: \`$NPM_CI_RC\`
          - npm run cert:base: \`$CERT_RC\`
          - npm run lint: \`$LINT_RC\`
          - npm run test:unit: \`$UNIT_RC\`
          - Playwright browser install: \`$PW_INSTALL_RC\`
          - npm run test:e2e: \`$E2E_RC\`
          - overall: \`$OVERALL_RC\`

          The uploaded artifact \`r6-a2x-exact-head-$GITHUB_RUN_ID\` contains command logs, the exact tested head, descendant-file scope, and any unexpected-file report. This carrier changes no production behavior and removes itself in the evidence commit.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r6-a2x-carrier.yml
          git add .gitl/evidence/round-6/a2x-carrier-result.md
          git commit -m "test(gitl): record A2X exact-head carrier result"
          git push origin HEAD:agent/8.8-repair-resume

      - name: Preserve gate verdict
        if: always()
        shell: bash
        run: |
          exit '${{ steps.gates.outputs.overall_rc }}'
