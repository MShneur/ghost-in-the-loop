name: Apply smoke version contract

on:
  push:
    branches:
      - agent/certification-preflight
    paths:
      - scripts/fix-smoke-version-contract.js
      - .github/workflows/apply-smoke-version-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certification-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic test patch
        run: node scripts/fix-smoke-version-contract.js
      - name: Install target browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Verify complete UI smoke in Chromium and Firefox
        run: npx playwright test tests/e2e/smoke/ui-smoke.spec.js --project=chromium --project=firefox
      - name: Commit verified test contract
        shell: bash
        run: |
          if git diff --quiet -- tests/e2e/smoke/ui-smoke.spec.js; then
            echo "Smoke version contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke/ui-smoke.spec.js
          git commit -m "test: derive smoke boot version from package metadata"
          git push origin HEAD:agent/certification-preflight
