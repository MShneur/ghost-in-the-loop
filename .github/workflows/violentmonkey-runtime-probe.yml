name: Violentmonkey runtime probe

on:
  push:
    branches:
      - test/violentmonkey-runtime-probe

permissions:
  contents: read

jobs:
  verify-violentmonkey-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Ghost test branch
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Ghost test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build pinned Violentmonkey MV3 and verify manifest contract
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/violentmonkey/violentmonkey.git /tmp/violentmonkey
          cd /tmp/violentmonkey
          git checkout --detach 1f882e04dd0881e1ce4eea632f341dc16f943635
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm install --frozen-lockfile
          pnpm build:mv3
          test -f dist-mv3/manifest.json
          node <<'NODE'
          const manifest = require('/tmp/violentmonkey/dist-mv3/manifest.json');
          if (manifest.manifest_version !== 3) {
            throw new Error(`Expected MV3 manifest, got ${manifest.manifest_version}`);
          }
          if (!manifest.background || typeof manifest.background.service_worker !== 'string' || !manifest.background.service_worker) {
            throw new Error(`Expected MV3 background.service_worker, got ${JSON.stringify(manifest.background || null)}`);
          }
          console.log(`VIOLENTMONKEY_MV3_MANIFEST_PASS serviceWorker=${manifest.background.service_worker}`);
          NODE
          echo "VIOLENTMONKEY_BUILD_PASS commit=$(git rev-parse HEAD)"

      - name: Launch real Violentmonkey MV3 in Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const extensionPath = '/tmp/violentmonkey/dist-mv3';
            const context = await chromium.launchPersistentContext('', {
              channel: 'chromium',
              headless: true,
              args: [
                `--disable-extensions-except=${extensionPath}`,
                `--load-extension=${extensionPath}`,
              ],
            });

            let [serviceWorker] = context.serviceWorkers();
            if (!serviceWorker) {
              serviceWorker = await context.waitForEvent('serviceworker', { timeout: 30000 });
            }
            const workerUrl = serviceWorker.url();
            const extensionId = new URL(workerUrl).host;
            if (!extensionId) throw new Error(`Violentmonkey service worker has no extension id: ${workerUrl}`);

            const page = await context.newPage();
            await page.goto(`chrome-extension://${extensionId}/options/index.html`, { waitUntil: 'domcontentloaded' });
            if (!page.url().startsWith(`chrome-extension://${extensionId}/`)) {
              throw new Error(`Could not open Violentmonkey extension page: ${page.url()}`);
            }

            console.log(`VIOLENTMONKEY_RUNTIME_PASS extensionId=${extensionId} worker=${workerUrl}`);
            await context.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install unchanged frozen Ghost through Violentmonkey and verify non-actuating boot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ghost-in-the-loop.user.js)" = "e5a9b79c929b3c5fbf3a664fab96e7aaa49bea28"
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');
          const http = require('http');

          (async () => {
            const extensionPath = '/tmp/violentmonkey/dist-mv3';
            const ghostSource = fs.readFileSync('ghost-in-the-loop.user.js', 'utf8');
            const mockHtml = fs.readFileSync('tests/e2e/mock-chat.html', 'utf8');
            const server = http.createServer((req, res) => {
              if (req.url === '/ghost-in-the-loop.user.js') {
                res.writeHead(200, {
                  'content-type': 'application/javascript; charset=utf-8',
                  'cache-control': 'no-store',
                });
                res.end(ghostSource);
                return;
              }
              res.writeHead(404, { 'content-type': 'text/plain; charset=utf-8' });
              res.end('not found');
            });
            await new Promise((resolve, reject) => {
              server.once('error', reject);
              server.listen(8080, '127.0.0.1', resolve);
            });

            const context = await chromium.launchPersistentContext('', {
              channel: 'chromium',
              headless: true,
              args: [
                `--disable-extensions-except=${extensionPath}`,
                `--load-extension=${extensionPath}`,
              ],
            });

            try {
              let [serviceWorker] = context.serviceWorkers();
              if (!serviceWorker) {
                serviceWorker = await context.waitForEvent('serviceworker', { timeout: 30000 });
              }
              const extensionId = new URL(serviceWorker.url()).host;
              if (!extensionId) throw new Error(`Violentmonkey service worker has no extension id: ${serviceWorker.url()}`);

              const installer = await context.newPage();
              await installer.goto('http://localhost:8080/ghost-in-the-loop.user.js', { waitUntil: 'domcontentloaded' });
              await installer.waitForURL((url) =>
                url.protocol === 'chrome-extension:' &&
                url.host === extensionId &&
                url.pathname.includes('/confirm/'),
              { timeout: 15000 });
              const installButton = installer.locator('#confirm');
              await installButton.waitFor({ state: 'visible', timeout: 15000 });
              if (await installButton.isDisabled()) throw new Error('Violentmonkey install button is disabled for frozen Ghost userscript');
              await installButton.click();
              await installer.waitForTimeout(750);

              const target = await context.newPage();
              const pageErrors = [];
              const fatalConsole = [];
              target.on('pageerror', (error) => pageErrors.push(String(error && (error.stack || error.message || error))));
              target.on('console', (message) => {
                const text = `[${message.type()}] ${message.text()}`;
                if (/\[GITL\].*FATAL/i.test(text)) fatalConsole.push(text);
              });
              await target.route('https://chatgpt.com/**', async (route) => {
                await route.fulfill({
                  status: 200,
                  contentType: 'text/html; charset=utf-8',
                  body: mockHtml,
                });
              });
              await target.goto('https://chatgpt.com/', { waitUntil: 'domcontentloaded' });
              await target.waitForFunction(() =>
                document.documentElement.getAttribute('data-gitl-boot') === 'ok:8.8.0',
              null, { timeout: 15000 });

              const beacon = await target.locator('html').getAttribute('data-gitl-boot');
              const panelCount = await target.locator('#gitl').count();
              if (beacon !== 'ok:8.8.0') throw new Error(`Unexpected Ghost boot beacon: ${beacon}`);
              if (panelCount !== 1) throw new Error(`Expected exactly one Ghost panel, got ${panelCount}`);
              if (pageErrors.length) throw new Error(`Ghost page errors: ${JSON.stringify(pageErrors)}`);
              if (fatalConsole.length) throw new Error(`Ghost fatal console output: ${JSON.stringify(fatalConsole)}`);

              console.log(`VIOLENTMONKEY_GHOST_BOOT_PASS beacon=${beacon} panelCount=${panelCount} extensionId=${extensionId}`);
            } finally {
              await context.close();
              await new Promise((resolve) => server.close(resolve));
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
