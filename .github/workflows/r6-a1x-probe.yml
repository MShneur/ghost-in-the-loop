name: R6 A1X deterministic structure probe

on:
  pull_request:
    branches:
      - gitl/r6-a1x-probe-base

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact authoritative head
        shell: bash
        run: |
          set -euo pipefail
          expected="2eed7b903de00abe5a22c5afc652550e5010f157"
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/agent/8.8-repair-resume | cut -f1)"
          printf 'expected=%s\nactual=%s\nremote=%s\n' "$expected" "$actual" "$remote"
          test "$actual" = "$expected"
          test "$remote" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic read-only structure probe
        run: npx playwright test tests/e2e/mobile-shell-structure-probe.spec.js --project=chromium

      - name: Record carrier evidence
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/r6-a1x-probe
          {
            echo "assignment=R6-A1X-MOBILE-SHELL-LIVE-STRUCTURE-CAPTURE"
            echo "tested_head=$(git rev-parse HEAD)"
            echo "remote_head=$(git ls-remote origin refs/heads/agent/8.8-repair-resume | cut -f1)"
            echo "command=npx playwright test tests/e2e/mobile-shell-structure-probe.spec.js --project=chromium"
            echo "live_authenticated_capture=NOT_OBTAINED_BROWSER_PERMISSION_REQUIRED"
          } > test-results/r6-a1x-probe/evidence.txt

      - name: Upload carrier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-a1x-deterministic-probe
          path: test-results/r6-a1x-probe/evidence.txt
          if-no-files-found: error
