name: R4 A3 Lifecycle Red Team Exact Head

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lifecycle-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Guard exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused lifecycle Jest
        run: npx jest tests/wake-recovery.test.js tests/lifecycle-recovery-contract.test.js --runInBand

      - name: Production lifecycle fixture - Chromium
        run: npx playwright test tests/e2e/repair-resume-production.spec.js --project=chromium

      - name: Adversarial lifecycle wake fixture - Chromium
        run: npx playwright test tests/e2e/lifecycle-redteam.spec.js --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-a3-lifecycle-redteam-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
