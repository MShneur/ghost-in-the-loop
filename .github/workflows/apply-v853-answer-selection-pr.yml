name: Apply v8.5.3 answer-selection patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v8.5.3-answer-selection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8.5.3-answer-selection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply patch
        run: python3 scripts/apply-v853-answer-selection.py
      - name: Generate extension and validate
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test:unit -- --runInBand
      - name: Commit verified result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-v853-answer-selection.yml
          git rm .github/workflows/apply-v853-answer-selection-pr.yml
          git rm scripts/apply-v853-answer-selection.py
          git add ghost-in-the-loop.user.js extension/content.js tests/perplexity-answer-selection.test.js
          git commit -m "fix: select the actual latest Perplexity answer"
          git push origin HEAD:agent/v8.5.3-answer-selection
