name: Apply 8.8.3 P0 Commit UI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-once:
    if: github.event.pull_request.head.ref == 'hotfix/8.8.3-p0-commit-ui-stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply deterministic patch
        run: node scripts/apply-8.8.3-p0-commit-ui.js
      - name: Generate extension parity
        run: node scripts/build-extension.js
      - name: Install dependencies
        run: npm ci
      - name: Focused P0 verification
        run: |
          node --check ghost-in-the-loop.user.js
          npm run check:generated
          npx jest tests/committee-commit-ui.test.js tests/directives.test.js --runInBand
      - name: Remove one-shot carrier and commit product patch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f scripts/apply-8.8.3-p0-commit-ui.js .github/workflows/apply-8.8.3-p0-commit-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make P Commit a stable primary action (8.8.3)'
          git push origin "HEAD:${HEAD_REF}"
