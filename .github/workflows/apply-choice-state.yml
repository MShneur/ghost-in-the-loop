name: Apply explicit CHOICE state

on:
  push:
    branches:
      - agent/choice-state-ui
    paths:
      - scripts/apply-choice-state.js.gz.b64
      - .github/workflows/apply-choice-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/choice-state-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -eu
          base64 -d scripts/apply-choice-state.js.gz.b64 | gzip -d > /tmp/apply-choice-state.js
          node --check /tmp/apply-choice-state.js
          node /tmp/apply-choice-state.js .
      - name: Build and certify generated extension
        run: npm run cert:base
      - name: Syntax checks
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Commit verified implementation
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-in-the-loop.user.js extension/content.js CHANGELOG.md tests/choice-state.test.js tests/signal.test.js
          if git diff --cached --quiet; then
            echo "Choice-state implementation already current"
            exit 0
          fi
          git commit -m "feat: pause safely for explicit user choices"
          git push origin HEAD:agent/choice-state-ui
