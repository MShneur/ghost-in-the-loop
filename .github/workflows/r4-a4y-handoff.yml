name: R4 A4Y Handoff Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  handoff-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Guard exact head and branch
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"
          test "${GITHUB_HEAD_REF}" = "agent/8.8-repair-resume"

      - name: Repair durable A4Y handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gitl-autopilot"
          git config user.email "gitl-autopilot@users.noreply.github.com"
          git checkout -B agent/8.8-repair-resume "${EXPECTED_HEAD}"

          python - <<'PY'
          from pathlib import Path

          p = Path('.gitl/evidence/round-4/worker-5.md')
          marker = '# A4Y Mobile Viewport Fixture Recovery Addendum'
          if marker not in p.read_text():
              lines = [
                  '',
                  '---',
                  '',
                  marker,
                  '',
                  '## Identity',
                  '- Round: 4',
                  '- Worker evidence slot: 5',
                  '- Intended role: `mobile-browser-test-fixture-repair`',
                  '- Executing successors: `automation-successor-a4y`; handoff recovery by scheduled successor after two failed carrier attempts',
                  '- Assignment ID: `R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE`',
                  '- Program: `LIFECYCLE-FROZEN-DISCARDED`',
                  '',
                  '## Step Performed',
                  'A4Y changed only the synthetic mobile test document by adding standards-correct device-width viewport metadata. The deliberate `width <= 500` assertion and all lifecycle/resource/Send/accessibility assertions remained unchanged.',
                  '',
                  'The technical execution completed successfully, but two later handoff-carrier attempts failed before updating durable evidence/state because the embedded Python addendum used an unterminated triple-quoted string. Recovery therefore repaired bookkeeping only and did not rerun or reinterpret the successful exact-head test.',
                  '',
                  '## Changes',
                  '- Fixture-only commit: `c2b2372ce961a5045810445c6184e9e2804babb4`.',
                  '- Exact-test carrier head: `53497095439feaff586454ca778560db287ff2aa`.',
                  '- Temporary test carrier cleanup commit: `cb2f622f2249409c25cb97ced691c36aa1d353ff`.',
                  '- Draft PR #19 was closed unmerged after evidence collection.',
                  '- Broken handoff PR #20 remained unmerged; its workflow is removed by this recovery transaction.',
                  '',
                  '## Tests and CI',
                  '- Workflow run: `31153444356`.',
                  '- Job: `92787723447` (`lifecycle-mobile-viewport`).',
                  '- Exact tested head: `53497095439feaff586454ca778560db287ff2aa`.',
                  '- Exact-head checkout/guard: PASS.',
                  '- Command: `npx playwright test tests/e2e/lifecycle-mobile-perf.spec.js --project=chromium-mobile`.',
                  '- Result: PASS — `1 passed (2.0s)`; test duration `556 ms`.',
                  '- Artifact ID: `8984194701`, size `3655` bytes, SHA-256 `19e40dac68753597703defdfe3e57b2e7c1f44f08cafbe775037b948e7aeb0ce`.',
                  '',
                  '## Verified Mobile Result',
                  '- CSS layout viewport: `412 x 839`.',
                  '- Device pixel ratio: `2.625`.',
                  '- Touch points: `1`.',
                  '- User agent: Android 14 / Pixel 7 / Chrome 148 mobile.',
                  '- 12/12 wake windows kept ticker, heartbeat, GhostBus initialization, and route re-detect at exactly one semantic restart each.',
                  '- Cache invalidations remained exactly `2` per window, inside the accepted bounded `1..2` contract.',
                  '- Active intervals remained within the fixture bound (`4 -> 5`); MutationObservers remained `3 -> 3`; lock records remained `1`; Ghost panel count remained `1`.',
                  '- Recovery caused zero submit/click/input/keydown events; the original input and Send node remained connected and unchanged; loop state remained `RUNNING`.',
                  '',
                  '## Evidence-Competitive Resolution',
                  '- Interpretation A, "Pixel 7 emulation was not applied," is rejected by the exact run evidence: Pixel 7 UA, DPR 2.625, touch=1.',
                  '- Interpretation B, "the synthetic page lacked mobile viewport metadata," is supported by source and the corrected observed width of 412 after adding device-width metadata.',
                  '- This certifies the fixture correction under Playwright Chromium mobile emulation only; it does not create physical-Android or Firefox-Android evidence.',
                  '',
                  '## Acceptance Criteria — A4Y',
                  '- Source-level root cause and prior exact failure preserved: PASS.',
                  '- Smallest fixture-only viewport correction: PASS.',
                  '- `width <= 500` preserved and observed at 412: PASS.',
                  '- Touch/mobile profile preserved: PASS.',
                  '- All 12 semantic restart/resource bounds preserved: PASS.',
                  '- Zero Send-adjacent actuation and host-node usability preserved: PASS.',
                  '- Exact guarded head/run/job/artifact evidence preserved: PASS.',
                  '- Temporary test carrier cleaned and PR #19 closed unmerged: PASS.',
                  '- Handoff carrier failure preserved rather than treated as a test failure: PASS.',
                  '',
                  '## Safety Checks',
                  '- Product implementation changed: NO.',
                  '- Send / CHOICE / route / lease / uncertainty safeguards weakened: NO.',
                  '- `main` modified: NO.',
                  '- Merge / auto-merge / tag / publish / release: NONE.',
                  '',
                  '## Risks and Limits',
                  '- Evidence is Playwright Pixel 7 Chromium emulation, not a physical Android device.',
                  '- Firefox Android / GeckoView remains untested here.',
                  '- Timing observations are descriptive GitHub-hosted measurements, not a calibrated low-end-device performance budget.',
                  '- `npm ci` reported two pre-existing high-severity dependency findings; this assignment changed no dependencies.',
                  '- GitHub Actions Node-action deprecation warnings remain maintenance signals, not lifecycle-test failures.',
                  '',
                  '## Recommended Next Action',
                  'Activate `R4-A5-LIFECYCLE-AUDIT` for independent audit of all Round-4 lifecycle source claims, exact-head CI bindings, mobile-emulation limitations, and safety invariants.',
                  '',
                  '## Assignment Status',
                  '- `R4-A4-LIFECYCLE-MOBILE-PERF`: submitted after exact execution recovery.',
                  '- `R4-A4X-LIFECYCLE-MOBILE-PERF-EXEC`: submitted after A4Y correction.',
                  '- `R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE`: submitted.',
                  ''
              ]
              p.write_text(p.read_text().rstrip() + '\n' + '\n'.join(lines))
          PY

          git add .gitl/evidence/round-4/worker-5.md
          git commit -m "docs(gitl): record A4Y viewport recovery evidence"
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          export EVIDENCE_COMMIT
          echo "evidence_commit=${EVIDENCE_COMMIT}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_commit = os.environ['EVIDENCE_COMMIT']
          plan_path = Path('.gitl/orchestration/round-plan.json')
          state_path = Path('.gitl/autopilot-state.json')
          plan = json.loads(plan_path.read_text())
          state = json.loads(state_path.read_text())

          by_id = {a['id']: a for a in plan.get('assignments', [])}
          for aid in ['R4-A4-LIFECYCLE-MOBILE-PERF', 'R4-A4X-LIFECYCLE-MOBILE-PERF-EXEC', 'R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE']:
              a = by_id[aid]
              a['status'] = 'submitted'
              a['evidencePath'] = '.gitl/evidence/round-4/worker-5.md'
              a['evidenceCommit'] = evidence_commit
              a.pop('blocker', None)

          a4y = by_id['R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE']
          a4y['fixtureCommit'] = 'c2b2372ce961a5045810445c6184e9e2804babb4'
          a4y['executionEvidence'] = {
              'testedHead': '53497095439feaff586454ca778560db287ff2aa',
              'runId': 31153444356,
              'jobId': 92787723447,
              'artifactId': 8984194701,
              'artifactSha256': '19e40dac68753597703defdfe3e57b2e7c1f44f08cafbe775037b948e7aeb0ce',
              'result': 'PASS: Pixel 7 chromium-mobile 1/1; width=412; touch=1; 12/12 exact semantic recovery windows; bounded resources; zero Send-adjacent events'
          }
          by_id['R4-A5-LIFECYCLE-AUDIT']['status'] = 'ready'

          plan['dispatch'] = {
              'nextWake': 'next eligible scheduled or manual agent',
              'nominalWorker': 6,
              'assignmentId': 'R4-A5-LIFECYCLE-AUDIT',
              'automatic': True,
              'instruction': 'Independently audit all Round-4 lifecycle evidence, exact heads, CI run/job/artifact bindings, source claims, mobile-emulation limits, and Send/CHOICE/route/lease/uncertainty preservation. Certify only what durable evidence proves; otherwise activate the smallest recovery.'
          }

          evidence = plan.setdefault('evidence', [])
          for entry in evidence:
              if entry.get('assignment') in {'R4-A4-LIFECYCLE-MOBILE-PERF', 'R4-A4X-LIFECYCLE-MOBILE-PERF-EXEC'}:
                  entry['status'] = 'submitted'
                  entry['commit'] = evidence_commit
                  entry.pop('executionRecovery', None)
          if not any(e.get('assignment') == 'R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE' for e in evidence):
              evidence.append({
                  'worker': 5,
                  'assignment': 'R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE',
                  'path': '.gitl/evidence/round-4/worker-5.md',
                  'status': 'submitted',
                  'commit': evidence_commit,
                  'testedHead': '53497095439feaff586454ca778560db287ff2aa',
                  'runId': 31153444356,
                  'jobId': 92787723447,
                  'artifactId': 8984194701
              })

          state['currentStep'] = ('R4-A4Y-LIFECYCLE-MOBILE-VIEWPORT-FIXTURE corrected only the synthetic mobile document by adding standards-correct device-width viewport metadata. Exact-head run 31153444356/job 92787723447 on head 53497095439feaff586454ca778560db287ff2aa passed the Pixel-7 chromium-mobile fixture 1/1 with width 412, touch 1, all 12 wake-window semantic/resource checks, zero Send-adjacent events, and host input/Send/latest-message usability intact. Artifact 8984194701 SHA-256 19e40dac68753597703defdfe3e57b2e7c1f44f08cafbe775037b948e7aeb0ce preserves reporter evidence. A4/A4X/A4Y are submitted and R4-A5-LIFECYCLE-AUDIT is ready.')
          state['nextAction'] = ('The next eligible wake claims R4-A5-LIFECYCLE-AUDIT and independently verifies every Round-4 lifecycle source claim, exact tested head, run/job/artifact binding, mobile-emulation limitation, and Send/CHOICE/route/lease/uncertainty safeguard before deciding certification or the smallest further recovery.')
          state['automaticDispatch'] = {
              'enabled': True,
              'scheduledFor': 'next eligible wake',
              'nominalWorker': 6,
              'assignmentId': 'R4-A5-LIFECYCLE-AUDIT',
              'claimableByAnyEligibleWorker': True,
              'holdForbiddenReasons': [
                  'missed prior worker slot',
                  'nominal role mismatch',
                  'previous failed test',
                  'previous blocked assignment with ready recovery'
              ],
              'holdRequiredReasons': [
                  'valid lease held by active agent',
                  'active workflow on relevant head',
                  'consistent branch movement proving current work',
                  'true project-wide human decision or irreversible/publication/security gate'
              ]
          }
          steps = state.setdefault('completedSteps', [])
          if not any(x.get('type') == 'round-4-a4y-mobile-viewport-pass' for x in steps):
              steps.append({
                  'type': 'round-4-a4y-mobile-viewport-pass',
                  'result': 'Fixture-only commit c2b2372ce961a5045810445c6184e9e2804babb4 added device-width viewport metadata without weakening width or lifecycle assertions. Exact-head run 31153444356/job 92787723447 passed Pixel-7 chromium-mobile 1/1 on head 53497095439feaff586454ca778560db287ff2aa. Artifact 8984194701 SHA-256 19e40dac68753597703defdfe3e57b2e7c1f44f08cafbe775037b948e7aeb0ce records the evidence. Two later handoff-carrier runs failed only in orchestration scripting; this recovery repaired the durable handoff without rerunning the already-certified test.'
              })
          findings = state.setdefault('findings', [])
          if not any(x.get('type') == 'lifecycle-mobile-viewport-fixture-pass' for x in findings):
              findings.append({
                  'worker': 5,
                  'type': 'lifecycle-mobile-viewport-fixture-pass',
                  'finding': 'A4Y proved the prior width=981 failure was a synthetic-document viewport contract defect: adding standards-correct device-width viewport metadata changed the Pixel-7 CSS layout viewport to 412 while preserving touch/DPR, all 12 exact semantic recovery windows, bounded resources, zero Send-adjacent events, and host usability. This remains emulation evidence, not physical Android or Firefox-Android certification.'
              })
          state['headAtLastHandoff'] = evidence_commit
          state['lease'] = None
          state['blockedReason'] = None
          state['publishReady'] = False

          plan_path.write_text(json.dumps(plan, indent=2) + '\n')
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY

          git rm .github/workflows/r4-a4y-handoff.yml
          git add .gitl/orchestration/round-plan.json .gitl/autopilot-state.json
          git commit -m "chore(gitl): hand off A4Y to lifecycle audit"
          git push origin HEAD:agent/8.8-repair-resume
