name: R4 A4Y Handoff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Guard exact head and branch
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_HEAD}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"
          test "${GITHUB_HEAD_REF}" = "agent/8.8-repair-resume"

      - name: Commit A4Y evidence and atomic handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gitl-autopilot"
          git config user.email "gitl-autopilot@users.noreply.github.com"
          git checkout -B agent/8.8-repair-resume "${EXPECTED_HEAD}"

          python - <<'PY'
          from pathlib import Path
          p = Path('.gitl/evidence/round-4/worker-5.md')
          addendum = r'''

